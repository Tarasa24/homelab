# VLAN IDs: Default (1), Trusted (10), IoT (20), Lab (30), DMZ (40), Monitoring (50)
#
# Every LXC is reached as `pct exec` from the PVE host (see plugins/connection/
# pct_ssh.py), so the addresses below are for addressing the services, not for
# Ansible connectivity. Only the PVE host is contacted over the network.

# BEGIN: Lab network - VLAN 30 - 10.0.30.0/24, gateway 10.0.30.1
## BEGIN: Physical hosts
[proxmox]
10.0.30.2 ansible_user=root ansible_ssh_private_key_file=~/.ssh/homelab_proxmox ansible_hostname=pve
## END: Physical hosts

[lxc_dns]
10.0.30.11 ansible_host=proxmox ansible_connection=pct_ssh lxc_host=3011 ansible_hostname=dns
[lxc_backup]
10.0.30.13 ansible_host=proxmox ansible_connection=pct_ssh lxc_host=3013 ansible_hostname=backup
[lxc_monitoring]
10.0.30.14 ansible_host=proxmox ansible_connection=pct_ssh lxc_host=3014 ansible_hostname=monitoring
# lxc_host is still 1005: the VMID move to 1015 is a manual PVE operation at
# cutover, because this VM has no borg config and a ForceNew would wipe it.
[vm_homeassistant]
10.0.30.15 ansible_host=proxmox lxc_host=1005

[lxc_private-docker-host]
10.0.30.20 ansible_host=proxmox ansible_connection=pct_ssh lxc_host=3020 ansible_hostname=private-docker-host
  # 10.0.30.20 traefik
  # Range from 10.0.30.21 - 10.0.30.30
  # 10.0.30.21 authelia
  # 10.0.30.22 vaultwarden
  # 10.0.30.23 arr stack
  # 10.0.30.24 firefly iii
  # 10.0.30.25 unifi controller
  # 10.0.30.26 ghostfolio
# END: Lab network

# BEGIN: DMZ network - VLAN 40 - 10.0.40.0/24, gateway 10.0.40.1 (UXG)
# DHCP for this VLAN is served by the UXG; every host below is static.
[lxc_dmz_proxy]
10.0.40.10 ansible_host=proxmox ansible_connection=pct_ssh lxc_host=4010 ansible_hostname=dmz-proxy
[lxc_dmz_bitcoin_node]
10.0.40.13 ansible_host=proxmox ansible_connection=pct_ssh lxc_host=4013 ansible_hostname=dmz-bitcoin-node

[lxc_dmz_docker-host]
10.0.40.20 ansible_host=proxmox ansible_connection=pct_ssh lxc_host=4020 ansible_hostname=dmz_docker-host
  # Range from 10.0.40.21 - 10.0.40.30
  # 10.0.40.21 jellyfin
  # 10.0.40.22 radicale
  # 10.0.40.23 immich
  # 10.0.40.24 ntfy
# END: DMZ network

# BEGIN: Monitoring VLAN 50 network - 10.0.50.0/24
# Static IP assignments (no DHCP on this network):
# 10.0.50.1 - dns (VLAN 50 interface)
# 10.0.50.2 - dmz-proxy (VLAN 50 interface)
# 10.0.50.3 - backup (VLAN 50 interface)
# 10.0.50.4 - monitoring (VLAN 50 interface)
# 10.0.50.20 - private-docker-host (VLAN 50 interface)
# 10.0.50.120 - dmz-docker-host (VLAN 50 interface)
# 10.0.50.103 - dmz-bitcoin-node (VLAN 50 interface)
# The PVE host has no VLAN 50 interface; it is scraped on the Lab VLAN.
# END: Monitoring VLAN 50 network
