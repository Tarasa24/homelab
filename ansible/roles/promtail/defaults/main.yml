---
# Which file under configs/promtail/ to deploy. `mandatory` so a missing
# hostname fails loudly instead of templating to an empty path.
promtail_config_name: "{{ ansible_hostname | mandatory }}"

# Debian only; kept close to the Loki server version.
promtail_version: "2.9.4"

# Optional systemd MemoryHigh for the Debian unit. Unset means no limit.
# MemoryHigh throttles and reclaims rather than killing, so a busy shipper
# degrades instead of tripping LogShippingStopped the way MemoryMax would.
promtail_memory_high: ""
