---
- name: Install Docker
  community.general.apk:
    name: [docker, docker-compose]
    state: present
    update_cache: true
  retries: 3

- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Ensure config file exists, if not populate with empty JSON object
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: '{}'
    mode: "0644"
    force: no

- name: Enable metrics endpoint
  ansible.builtin.lineinfile:
    path: /etc/docker/daemon.json
    line: '"metrics-addr": 0.0.0.0:9323'
    create: yes
    state: present
    mode: "0644"

- name: Start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
