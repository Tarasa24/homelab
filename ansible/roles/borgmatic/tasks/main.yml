---
- name: Install borgmatic and dependencies
  community.general.apk:
    name: [borgbackup, borgmatic, openssh, yq]
    state: present

- name: Make sure .ssh directory exists
  ansible.builtin.file:
    dest: /root/.ssh
    state: directory
    mode: 0700
- name: Import ssh private key
  ansible.builtin.copy:
    src: ../../../secrets/backup/ssh/id_ed25519
    dest: /root/.ssh/id_ed25519
    mode: 0600

- name: Create /etc/borgmatic directory
  ansible.builtin.file:
    dest: /etc/borgmatic
    state: directory

- name: Check if borgmatic config already exists (indicates this container has been set up before)
  ansible.builtin.stat:
    path: /etc/borgmatic/config.yaml
  register: existing_borgmatic_config
  changed_when: false

- name: Copy over borgmatic configuration
  ansible.builtin.copy:
    src: ../../../configs/backup/borg/{{ ansible_hostname }}.yaml
    dest: /etc/borgmatic/config.yaml
    mode: 0644

- name: Import data from backup (only if config didn't exist before - fresh container)
  ansible.builtin.command:
    cmd: "borgmatic extract --archive latest --destination /"
  ignore_errors: true
  register: borgmatic_extract
  when: not existing_borgmatic_config.stat.exists

- name: Check if borgmatic extract failed
  ansible.builtin.fail:
    msg: "borgmatic extract failed"
  when: >
    borgmatic_extract is defined and
    borgmatic_extract.rc is defined and
    borgmatic_extract.rc != 0 and
    "No archives found in the repository" not in borgmatic_extract.stderr and
    "does not exist" not in borgmatic_extract.stderr

- name: Extract source_directories from borgmatic configuration and export from the role
  ansible.builtin.shell: "yq '.source_directories[]' /etc/borgmatic/config.yaml"
  register: source_directories

# extract can report rc=0 while restoring nothing; catch that before
# docker-compose boots services against silently-empty volumes
- name: Check restored docker volumes actually contain data
  ansible.builtin.find:
    paths: "{{ item }}"
    recurse: true
    file_type: file
  register: restored_volume_check
  loop: "{{ source_directories.stdout_lines }}"
  when: >
    not existing_borgmatic_config.stat.exists and
    borgmatic_extract is defined and
    borgmatic_extract.rc is defined and
    borgmatic_extract.rc == 0 and
    item is search('/var/lib/docker/volumes')

- name: Fail loudly if a restored docker volume is empty
  ansible.builtin.fail:
    msg: "extract reported success but {{ item.item }} is empty after restore"
  loop: "{{ restored_volume_check.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('n/a') }}"
  when: item.matched is defined and item.matched == 0

- name: Make sure docker volumes get created (if path contains /var/lib/docker/volumes)
  ansible.builtin.command:
    cmd: "docker volume create {{ item | regex_replace('/var/lib/docker/volumes/', '') | regex_replace('/_data', '') }}"
  with_items: "{{ source_directories.stdout_lines }}"
  when: item is search('/var/lib/docker/volumes')  

- name: Setup cron job for borgmatic
  ansible.builtin.cron:
    name: "Run borgmatic backup"
    job: "borgmatic --verbosity 0"
    minute: "0"
    hour: "2"
    state: present
