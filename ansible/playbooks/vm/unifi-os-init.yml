---
# Real VM (terraform/vm_unifi_os.tf), reached over network SSH -- no pct exec.
- name: Configure UniFi OS Server
  hosts: vm_unifi_os
  gather_facts: false
  # Connects as the cloud-init "ansible" user, not root.
  become: true
  vars:
    ntfy_alertmanager_password: "{{ lookup('file', '../../../secrets/monitoring/ntfy_alertmanager_password') }}"
    # Installer URL is versioned/signed and expires -- grab the current Linux
    # x64 link from https://ui.com/download/software/unifi-os-server and pass
    # it via -e unifi_os_installer_url=...
    unifi_os_installer_url: "{{ unifi_os_installer_url | mandatory }}"
  roles:
    - role: node_exporter
    - role: promtail
      promtail_config_name: unifi-os
      # 7th largest process in this VM at ~100 MB, on a host with no spare.
      promtail_memory_high: 64M
      tags: [memory]
    - role: borgmatic

  tasks:
    # podman/uidmap/slirp4netns per Ubiquiti's Linux install doc. The installer
    # hard-codes /usr/bin/podman, so the apt package is required.
    - name: Install podman and dependencies
      ansible.builtin.apt:
        pkg: [podman, uidmap, slirp4netns]
        update_cache: true
      retries: 3

    - name: Check if UOS Server is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/uosserver
      register: uosserver_installed

    - name: Install UOS Server
      when: not uosserver_installed.stat.exists
      block:
        - name: Download UOS Server installer
          ansible.builtin.get_url:
            url: "{{ unifi_os_installer_url }}"
            dest: /root/unifi-os-server.bin
            mode: "0755"
          register: uos_download
          until: uos_download is succeeded
          retries: 5
          delay: 10

        # `yes` auto-confirms the interactive prompt. `|| true`: the installer's
        # own 60s "wait for healthy" can exit non-zero even when the container
        # comes up fine; the verification task below is the real gate.
        - name: Run UOS Server installer
          ansible.builtin.shell: "set -o pipefail && yes | /root/unifi-os-server.bin || true"
          args:
            executable: /bin/bash
          changed_when: true

        - name: Remove installer binary
          ansible.builtin.file:
            path: /root/unifi-os-server.bin
            state: absent

    - name: Enable and start uosserver services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - uosserver.service
        - uosserver-updater.service

    # Direct podman health query, not `uosserver status`: the latter's full
    # text report is slow and can lag the container's real state.
    # chdir: / is required -- otherwise sudo -u uosserver fails to chdir into
    # the connecting user's home and emits "cannot chdir" ahead of the value,
    # breaking the exact-match `until` below.
    - name: Verify uosserver actually came up
      ansible.builtin.shell: sudo -u uosserver podman inspect --format '{{ "{{" }}.State.Health.Status{{ "}}" }}' uosserver
      args:
        chdir: /
      register: uosserver_health
      until: uosserver_health.stdout == "healthy"
      retries: 120
      delay: 10
      changed_when: false

    # Memory trimming, tagged `memory` to run without re-checking the
    # installer or the borgmatic restore. This VM is sized below Ubiquiti's
    # tested minimum (see terraform/vm_unifi_os.tf), so the guest has to
    # give back what it does not need.
    - name: Remove the unused MTA
      ansible.builtin.apt:
        name: exim4*
        state: absent
        purge: true
        autoremove: true
      tags: [memory]

    # The guest ships with no swap at all, so its only answer to pressure is
    # the OOM killer -- and unifi's JVM runs -XX:+ExitOnOutOfMemoryError, so
    # it hard-exits rather than degrades. zram gives idle vendor services
    # (innerspace, identity, directory, rabbitmq) somewhere to go. This is
    # the one place zram fits; the host uses zswap instead.
    - name: Install systemd-zram-generator
      ansible.builtin.apt:
        name: systemd-zram-generator
        state: present
        update_cache: true
      tags: [memory]

    - name: Configure zram swap
      ansible.builtin.copy:
        dest: /etc/systemd/zram-generator.conf
        content: |
          [zram0]
          zram-size = 512
          compression-algorithm = zstd
        mode: "0644"
      register: unifi_os_zram_conf
      tags: [memory]

    - name: Start zram swap
      ansible.builtin.systemd:
        name: systemd-zram-setup@zram0.service
        state: "{{ 'restarted' if unifi_os_zram_conf.changed else 'started' }}"
        daemon_reload: true
      tags: [memory]

    # unifi.service ships -Xmx512M inline, but /etc/default/unifi replaces
    # UNIFI_JVM_OPTS with -XX:MaxRAMPercentage=70.0, so the heap ceiling
    # tracks guest RAM instead of the workload (3 small sites here) -- ~2.7 GB
    # of a 4 GB VM. unifi.xmx in system.properties is NOT read by UOS Server;
    # the only knob is this variable.
    #
    # env-overrides is loaded after /etc/default/unifi so it wins, and unlike
    # /etc/default (overlay, i.e. image) /var/lib/unifi is on the VM disk and
    # survives the vendor's in-place updates. The other flags are copied from
    # /etc/default/unifi because this replaces the variable wholesale -- check
    # them against the image after a major UOS upgrade.
    - name: Pin the UniFi Network JVM heap
      ansible.builtin.shell: |
        set -eu
        opts='UNIFI_JVM_OPTS="-Dunifi-os.server=true -Dorg.xerial.snappy.tempdir=/usr/lib/unifi/run -XX:+UseG1GC -Xmx1024M -Xss1024K -XX:-TieredCompilation"'
        current=$(sudo -u uosserver podman exec uosserver cat /var/lib/unifi/env-overrides 2>/dev/null || true)
        if [ "$current" = "$opts" ]; then
          echo unchanged
        else
          printf '%s\n' "$opts" \
            | sudo -u uosserver podman exec -i uosserver tee /var/lib/unifi/env-overrides >/dev/null
          echo changed
        fi
      args:
        chdir: /
      register: unifi_os_xmx
      # Equality, not `in`: "unchanged" contains "changed", so a substring
      # test reports changed on every run and restarts the app each time.
      changed_when: unifi_os_xmx.stdout == "changed"
      notify: Restart UniFi Network
      tags: [memory]

  handlers:
    - name: Restart UniFi Network
      ansible.builtin.command: sudo -u uosserver podman exec uosserver systemctl restart unifi
      args:
        chdir: /
      changed_when: true
      tags: [memory]
