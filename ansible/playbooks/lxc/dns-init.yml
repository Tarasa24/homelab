---
- name: Configure dns
  hosts: lxc_dns
  gather_facts: false
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].ansible_host }}"
    lxc_host: "{{ hostvars[inventory_hostname].lxc_host }}"
  roles:
    - role: lxc_python3
    - role: borgmatic
    - role: node_exporter
    - role: promtail

  tasks:
    - name: Check if technitium-dns directory exists
      ansible.builtin.stat:
        path: /opt/technitium-dns
      register: technitium_exists
      changed_when: false

    - name: Trigger backup before removing existing technitium dns (ignore hook failures)
      command: borgmatic --verbosity 1 --stats
      register: backup_result
      changed_when: false
      failed_when: backup_result.rc != 0 and "Creating archive at" not in backup_result.stdout
      when: technitium_exists.stat.exists

    - name: Remove existing technitium dns only if it exists
      ansible.builtin.command:
        cmd: rm -rf /opt/technitium-dns && rm -rf /tmp/DnsServerPortable.tar.gz
      when: technitium_exists.stat.exists

    - name: Configure edge repositories for ASP.NET Core runtime
      copy:
        dest: /etc/apk/repositories
        content: |
          https://dl-cdn.alpinelinux.org/alpine/edge/main
          https://dl-cdn.alpinelinux.org/alpine/edge/community
          https://dl-cdn.alpinelinux.org/alpine/edge/testing

    - name: Update apk repositories
      ansible.builtin.command:
        cmd: apk update

    - name: Install ASP.NET Core runtime from Edge
      ansible.builtin.apk:
        name: aspnetcore9-runtime
        state: present

    - name: Switch back to stable repositories
      copy:
        dest: /etc/apk/repositories
        content: |
          https://dl-cdn.alpinelinux.org/alpine/latest-stable/main
          https://dl-cdn.alpinelinux.org/alpine/latest-stable/community

    - name: Update apk repositories again
      ansible.builtin.command:
        cmd: apk update

    # Pinned, not "latest": a fresh provision on 2026-09-06 pulled v15.4.0,
    # which targets net10.0, whose aspnetcore10-runtime Alpine package fails
    # to start here (native crypto shim can't resolve EVP_PKEY_sign_message_init
    # against this Alpine's openssl3 -- an Alpine packaging bug, not something
    # to chase at deploy time). v15.2.0 was also checked and *also* targets
    # net10.0 (runtimeOptions.tfm in DnsServerApp.runtimeconfig.json) -- the
    # switch happened earlier than expected. v14.3.0 is the newest release
    # confirmed to target net9.0 and run cleanly against aspnetcore9-runtime.
    # Before trusting any newer pin, extract the tarball and check
    # DnsServerApp.runtimeconfig.json's tfm before deploying it.
    - name: Download technitium dns
      ansible.builtin.command:
        cmd: wget https://download.technitium.com/dns/archive/14.3.0/DnsServerPortable.tar.gz
        chdir: /tmp

    - name: Create technitium dns directory
      ansible.builtin.file:
        path: /opt/technitium-dns
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Extract technitium dns
      ansible.builtin.command:
        cmd: tar -xzf DnsServerPortable.tar.gz -C /opt/technitium-dns
        chdir: /tmp

    - name: Create technitium dns service
      ansible.builtin.copy:
        dest: /etc/init.d/technitium-dns
        content: |
          #!/sbin/openrc-run

          name="Technitium DNS Server"
          description="Technitium DNS as an Alpine Service"

          directory="/opt/technitium-dns"
          command="/opt/technitium-dns/start.sh"
          command_user="root"
          command_background="yes"
          pidfile="/var/run/technitium-dns.pid"

          # command_background was missing: start.sh execs dotnet directly and
          # never writes its own pidfile, so start-stop-daemon ran it attached
          # to whatever session invoked `rc-service start` (hanging that
          # session at "Press CTRL+C to stop") and OpenRC never had a real PID
          # to track, so status/stop/start all disagreed with reality afterward.
          # With command_background set, start-stop-daemon backgrounds it and
          # manages pidfile itself.
          depend() {
              need net
          }

          start_pre() {
              checkpath -d -m 0755 -o root:root /opt/technitium-dns
          }

    - name: Make service executable
      ansible.builtin.command:
        cmd: chmod +x /etc/init.d/technitium-dns

    - name: Register technitium dns service
      ansible.builtin.command:
        cmd: rc-update add technitium-dns default

    - name: Start technitium dns service
      ansible.builtin.command:
        cmd: rc-service technitium-dns start