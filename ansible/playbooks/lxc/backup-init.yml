---
- name: Configure backup server
  hosts: lxc_backup
  gather_facts: false

  vars:
    ansible_host: "{{ hostvars[inventory_hostname].ansible_host }}"
    lxc_host: "{{ hostvars[inventory_hostname].lxc_host }}"
    repositories_dir: /backup/repos
    # Storage Box SSH listens on 23, not 22, and restic's sftp backend has no
    # port option -- hence the ssh config alias written below.
    hetzner_storagebox_host: "{{ lookup('file', '../../../secrets/hetzner/storagebox_host') | trim }}"
    hetzner_storagebox_port: 23
    # Host key lines as published by Hetzner, in known_hosts format. Pinned
    # rather than accepted on first use: this is the one backup hop that leaves
    # the network, so the server gets authenticated. Restic encrypts the
    # payload either way, but without this an active attacker can impersonate
    # the Storage Box instead of merely observing ciphertext.
    hetzner_storagebox_host_key: "{{ lookup('file', '../../../secrets/hetzner/storagebox_host_key') }}"
    resticprofile_configurations:
      - global
      - borg-to-hetzner-storagebox
      - immich-media-to-hetzner-storagebox
  roles:
    - role: lxc_python3
    - role: node_exporter
    - role: promtail

  pre_tasks:
    - name: Find all ".yaml" and ".yml" borgmatic configuration files
      local_action:
        module: find
        paths: "../../../configs/backup/borg"
        patterns: "*.yml,*.yaml"
        file_type: file
      register: borgmatic_configs
    - name: Set the config names as a variable
      ansible.builtin.set_fact:
        repositories: "{{ borgmatic_configs.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.(yml|yaml)$', '') | list }}"
  tasks:
    - name: Install ssh
      ansible.builtin.apk:
        name: openssh
        state: present
    - name: Start sshd
      ansible.builtin.service:
        name: sshd
        state: started
        enabled: true
    - name: Set PubKeyAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "PubKeyAuthentication yes"
        state: present
    - name: Set PasswordAuthentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        line: "PasswordAuthentication no"
        state: present
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Create backup group
      ansible.builtin.group:
        name: backup
        gid: 1000
        state: present
    - name: Create backup user
      ansible.builtin.user:
        name: backup
        group: backup
        groups:
        shell: /bin/ash
        home: /home/backup
        create_home: yes
        uid: 1000
        password: "{{ lookup('password', '/dev/null length=15 chars=ascii_letters') | password_hash('sha512') }}"
        state: present
    - name: Create backup home directory
      ansible.builtin.file:
        path: /home/backup
        state: directory
        owner: backup
        group: backup
        mode: '0700'
    - name: Create backup crontab entry
      ansible.builtin.file:
        path: /var/spool/cron/crontabs/backup
        state: touch
        owner: backup
        group: backup
        mode: '0600'

    - name: Create backup .ssh directory
      ansible.builtin.file:
        path: /home/backup/.ssh
        state: directory
        owner: backup
        group: backup
        mode: '0700'
    - name: Install Storage Box SSH key
      ansible.builtin.copy:
        src: ../../../secrets/hetzner/storage_box_ssh_key
        dest: /home/backup/.ssh/hetzner_storagebox
        owner: backup
        group: backup
        mode: '0600'
    - name: Pin the Storage Box host key
      ansible.builtin.copy:
        content: "{{ hetzner_storagebox_host_key }}"
        dest: /home/backup/.ssh/known_hosts_hetzner
        owner: backup
        group: backup
        mode: '0600'
    # restic addresses the repository as sftp:hetzner-storagebox:..., so this
    # alias is what supplies the non-standard port, the key and the pinned host
    # key. Unlike the borg clients on the LAN, this connection leaves the
    # network, so it verifies the server rather than trusting on first use.
    - name: Configure ssh alias for the Storage Box
      ansible.builtin.copy:
        content: |
          Host hetzner-storagebox
              HostName {{ hetzner_storagebox_host }}
              Port {{ hetzner_storagebox_port }}
              User {{ hetzner_storagebox_host.split('.')[0] }}
              IdentityFile /home/backup/.ssh/hetzner_storagebox
              IdentitiesOnly yes
              StrictHostKeyChecking yes
              UserKnownHostsFile /home/backup/.ssh/known_hosts_hetzner
              BatchMode yes
        dest: /home/backup/.ssh/config
        owner: backup
        group: backup
        mode: '0600'

    - name: Install restic
      ansible.builtin.apk:
        name: restic
        state: present
    - name: Install fuse (for restic mount)
      ansible.builtin.apk:
        name: fuse
        state: present
    - name: Check if resticprofile is installed
      ansible.builtin.stat:
        path: /usr/local/bin/resticprofile
      register: resticprofile_installed
    - name: Install resticprofile
      block:
        - name: Curl resticprofile
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/creativeprojects/resticprofile/master/install.sh
            dest: /tmp/resticprofile.sh
            mode: 'u+x'

        - name: Compile resticprofile
          ansible.builtin.command:
            cmd: /tmp/resticprofile.sh -b /usr/local/bin
            creates: /usr/local/bin/resticprofile
      when: not resticprofile_installed.stat.exists

    - name: Create resticprofile configuration directory
      ansible.builtin.file:
        path: /home/backup/.config/resticprofile
        state: directory
        owner: backup
        group: backup
        mode: '0700'
    # profiles.yaml is rebuilt by concatenating the templates below, so it is
    # removed first to keep the play idempotent rather than appending forever.
    - name: Clean up resticprofile configurations
      ansible.builtin.file:
        path: /home/backup/.config/resticprofile/profiles.yaml
        state: absent
      changed_when: false
    - name: Copy resticprofile configurations
      ansible.builtin.template:
        src: ../../../configs/backup/resticprofile/{{ item }}.yaml.j2
        dest: /tmp/{{ item }}.yaml
        mode: '0600'
        owner: backup
        group: backup
      with_items: "{{ resticprofile_configurations }}"
    - name: Concat resticprofile configurations
      ansible.builtin.shell: cat /tmp/{{ item }}.yaml >> /home/backup/.config/resticprofile/profiles.yaml
      with_items: "{{ resticprofile_configurations }}"
      become_user: backup
      become_method: su
      become_flags: '-s /bin/sh'
    - name: Copy resticprofile password file
      ansible.builtin.copy:
        src: ../../../secrets/backup/resticprofile/restic-password.txt
        dest: /home/backup/.config/resticprofile/restic-password.txt
        mode: '0400'
        owner: backup
        group: backup
    # restic's sftp backend creates the repository directory but not its
    # parents, so a fresh Storage Box needs the tree laid out first or every
    # init fails with "mkdir: file does not exist". Done over SFTP rather than
    # `ssh ... mkdir` because SFTP is the one interface a Storage Box is
    # guaranteed to expose; the restricted SSH shell varies by plan. The
    # leading `-` tells sftp to carry on when a directory already exists.
    - name: Ensure the Storage Box parent directories exist
      ansible.builtin.shell:
        cmd: |
          printf -- '-mkdir backups\n-mkdir backups/borg\n' | sftp -b - hetzner-storagebox
      changed_when: false
      become: true
      become_user: backup
      become_method: su
      become_flags: '-s /bin/sh'

    - name: Init restic repositories if they don't already exist
      ansible.builtin.command: resticprofile {{ item }}.init
      with_items: "{{ repositories + ['immich-media'] }}"
      ignore_errors: true
      register: restic_init
      become: true
      become_user: backup
      become_method: su
      become_flags: '-s /bin/sh'
    # restic phrases "already initialized" two different ways depending on
    # which check fails first -- both mean the repo already exists, neither
    # is a real error.
    - name: Check for errors in restic init
      ansible.builtin.fail:
        msg: "Error initializing restic repository"
      when: >-
        item.rc != 0 and
        "repository master key and config already initialized" not in item.stderr and
        "config file already exists" not in item.stderr
      with_items: "{{ restic_init.results }}"
      become: true
      become_user: backup
      become_method: su
      become_flags: '-s /bin/sh'
    - name: Schedule restic backups
      ansible.builtin.command: resticprofile {{ item }}.schedule
      with_items: "{{ repositories + ['immich-media'] }}"
      become: true
      become_user: backup
      become_method: su
      become_flags: '-s /bin/sh'
      

    - name: Install borg + borgmatic
      ansible.builtin.apk:
        name: [ borgbackup, borgmatic ]
        state: present
    - name: Create directory for backup repositories
      ansible.builtin.file:
        path: "{{ repositories_dir }}"
        state: directory
        owner: backup
        group: backup
        mode: '0700'
    - name: Create backup ssh directory
      ansible.builtin.file:
        path: /home/backup/.ssh
        state: directory
        owner: backup
        group: backup
        mode: '0700'
    - name: Set authorized_keys
      ansible.builtin.authorized_key:
        user: backup
        key: "{{ lookup('file', '../../../secrets/backup/ssh/id_ed25519.pub') }}"
        key_options: 'command="/usr/bin/borg serve --restrict-to-path {{ repositories_dir }}",restrict'
    - name: Set authrized keys permissions
      ansible.builtin.file:
        path: /home/backup/.ssh/authorized_keys
        owner: backup
        group: backup
        mode: '0600'
        state: file

    - name: Init borg repositories if they don't already exist
      ansible.builtin.command:
        cmd: borg init --encryption=none {{ repositories_dir }}/{{ item }}
        creates: "{{ repositories_dir }}/{{ item }}/config"
      become: true
      become_user: backup
      become_method: su
      become_flags: '-s /bin/sh'
      with_items: "{{ repositories }}"

    - name: Recursively change owner of borg repos
      ansible.builtin.file:
        path: "{{ repositories_dir }}/"
        state: directory
        owner: backup
        group: backup
        recurse: yes

    - name: Install pyfuse3 (for borg mount)
      ansible.builtin.apk:
        name: py3-pyfuse3
        state: present
