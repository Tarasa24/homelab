---
- name: Configure private docker host
  hosts: lxc_private-docker-host
  gather_facts: false
  vars:
    ansible_host: "{{ hostvars[inventory_hostname].ansible_host }}"
    lxc_host: "{{ hostvars[inventory_hostname].lxc_host }}"
    ip_range: [
      "10.0.30.21",
      "10.0.30.22",
      "10.0.30.23",
      "10.0.30.24",
      "10.0.30.25",
      "10.0.30.26",
      "10.0.30.27",
      "10.0.30.28",
      "10.0.30.29",
      "10.0.30.30"
    ]
    ntfy_alertmanager_password: "{{ lookup('file', '../../../secrets/monitoring/ntfy_alertmanager_password') }}"
    gitea_secret_key: "{{ lookup('file', '../../../secrets/private-docker-host/gitea/secret_key') }}"
    gitea_internal_token: "{{ lookup('file', '../../../secrets/private-docker-host/gitea/internal_token') }}"
    gitea_admin_password: "{{ lookup('file', '../../../secrets/private-docker-host/gitea/admin_password') }}"
  pre_tasks:
    - name: Safely stop and remove existing containers
      shell: docker compose down || true
      ignore_errors: yes
  roles:
    - role: lxc_python3
    - role: docker
    - role: node_exporter
    - role: borgmatic

  tasks:
    - name: Assign IP range to virtual nics if not already assigned
      shell: ip addr add {{ ip }} dev eth0:{{ index }} || true
      loop: "{{ ip_range }}"
      loop_control:
        loop_var: ip
        index_var: index

    - name: Have ip addr add commands run at boot
      copy:
        content: |
          {% for ip in ip_range %}
          ip addr add {{ ip }} dev eth0:{{ loop.index0 }}
          {% endfor %}
        dest: /etc/local.d/assign-ips.start
        mode: "0755"

    - name: Enable local.d scripts
      ansible.builtin.command: rc-update add local default

    - name: Stop and remove existing containers
      shell: docker compose down || true

    - name: Remove old configs
      shell: rm -rf /root/*

    - name: Copy over configs
      copy:
        src: "../../../configs/private-docker-host/"
        dest: "/root/"
        force: yes

    # Rendered separately so secret values never land in the git tree.
    - name: Render Gitea secrets env file
      ansible.builtin.template:
        src: templates/gitea.env.j2
        dest: /root/gitea/gitea.env
        mode: "0600"

    - name: Find each docker-compose.yaml in relation to /root
      find:
        paths: /root
        patterns: "docker-compose.yaml"
        recurse: yes
      register: docker_compose_files
    - name: Create .env file which contains COMPOSE_FILE=... for each docker-compose.yaml
      copy:
        content: "COMPOSE_FILE={{ compose_files }}"
        dest: "/root/.env"
      vars:
        compose_files: "{{ docker_compose_files.files | map(attribute='path') | join(':') }}"

    - name: Pull images
      shell: docker-compose pull -q
      args:
        chdir: /root
      timeout: 1200
      retries: 3

    - name: Start containers
      shell: docker-compose up -d
      args:
        chdir: /root

    - name: Wait for Gitea to accept connections
      ansible.builtin.wait_for:
        host: "10.0.30.29"
        port: 80
        delay: 5
        timeout: 120

    # "already exists" is treated as success so reruns don't fail.
    - name: Ensure Gitea admin user exists
      shell: >-
        docker exec -u git gitea gitea admin user create
        --config /data/gitea/conf/app.ini
        --admin --username gitea-admin --email admin@lan.tarasa24.dev
        --password '{{ gitea_admin_password }}' --must-change-password=false
      register: gitea_admin_create
      changed_when: "'already exists' not in gitea_admin_create.stderr"
      failed_when: >-
        gitea_admin_create.rc != 0 and
        'already exists' not in gitea_admin_create.stderr

    # Traefik only reloads a TLS cert when dynamic.yml's own mtime changes,
    # not when the cert file itself changes -- this is what tells it to look.
    - name: Schedule dynamic.yml touch on lan wildcard cert renewal
      ansible.builtin.cron:
        name: "Reload Traefik TLS cert on lan wildcard renewal"
        job: >-
          find /root/traefik/config/dynamic.yml -not -newer
          /etc/letsencrypt/live/*.lan.tarasa24.dev/fullchain.pem
          -exec touch /root/traefik/config/dynamic.yml \;
        minute: "0"
        state: present
