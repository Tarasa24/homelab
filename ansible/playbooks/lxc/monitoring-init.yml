---
- name: Configure monitoring container
  hosts: lxc_monitoring
  gather_facts: false
  roles:
    - role: lxc_python3
    - role: docker
    - role: node_exporter

  tasks:
    - name: Try to down containers
      shell: docker-compose down || true
      args:
        chdir: /root
      ignore_errors: true

    - name: Remove old configs (except persistent data)
      shell: |
        # Remove everything except docker-compose.yaml and data directories
        find /root -maxdepth 1 -type f -name "docker-compose.yaml" -delete
        find /root -maxdepth 1 -type d ! -name "." ! -name ".." -exec rm -rf {} +
      args:
        chdir: /root
      ignore_errors: true
    
    - name: Copy over configs
      copy:
        src: "../../../configs/monitoring/"
        dest: "/root/"
        owner: root
        group: root
        mode: '0644'
        directory_mode: '0755'

    

    - name: Create directories for persistent storage
      ansible.builtin.file:
        name: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0755') }}"
      with_items:
        - { path: /mnt/monitoring-cold/prometheus, owner: nobody, group: nobody, mode: '0777' }
        - { path: /mnt/monitoring-cold/loki, owner: root, group: root, mode: '0755' }
        - { path: /mnt/monitoring-cold/uptime-kuma, owner: 1000, group: 1000, mode: '0755' }
        - { path: /mnt/monitoring-cold/grafana, owner: nobody, group: nobody, mode: '0777' }
    
    - name: Create Loki subdirectories
      ansible.builtin.file:
        name: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      with_items:
        - /mnt/monitoring-cold/loki/wal
        - /mnt/monitoring-cold/loki/index
        - /mnt/monitoring-cold/loki/cache
        - /mnt/monitoring-cold/loki/chunks
        - /mnt/monitoring-cold/loki/compactor
    
    - name: Create missing Grafana provisioning directories
      ansible.builtin.file:
        name: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      with_items:
        - /root/grafana/provisioning/plugins
        - /root/grafana/provisioning/alerting
    
    - name: Fix existing directory permissions
      shell: |
        # Fix permissions on existing directories if they exist
        [ -d /mnt/monitoring-cold/prometheus ] && chown -R nobody:nobody /mnt/monitoring-cold/prometheus && chmod -R 0777 /mnt/monitoring-cold/prometheus || true
        [ -d /mnt/monitoring-cold/loki ] && chown -R root:root /mnt/monitoring-cold/loki && chmod -R 0755 /mnt/monitoring-cold/loki || true
        [ -d /mnt/monitoring-cold/grafana ] && chown -R nobody:nobody /mnt/monitoring-cold/grafana && chmod -R 0777 /mnt/monitoring-cold/grafana || true
        [ -d /mnt/monitoring-cold/uptime-kuma ] && chown -R 1000:1000 /mnt/monitoring-cold/uptime-kuma && chmod -R 0755 /mnt/monitoring-cold/uptime-kuma || true
    
    - name: Pull images
      shell: docker-compose pull -q
      args:
        chdir: /root
      timeout: 1200
      retries: 3
    
    - name: Start containers
      shell: docker-compose up -d
      args:
        chdir: /root
    
    - name: Wait for Prometheus to be healthy
      shell: timeout 120 bash -c "until curl -s -f http://localhost:9090/-/healthy >/dev/null; do echo 'Waiting for Prometheus...'; sleep 5; done; echo 'Prometheus is healthy'"
      args:
        chdir: /root
      ignore_errors: true
    
    - name: Wait for Loki to be ready
      shell: timeout 180 bash -c "until curl -s -f http://localhost:3100/ready >/dev/null; do echo 'Waiting for Loki...'; sleep 5; done; echo 'Loki is ready'"
      args:
        chdir: /root
      ignore_errors: true
    
    - name: Wait for Grafana to be healthy
      shell: timeout 120 bash -c "until curl -s -f http://localhost:3000/api/health >/dev/null; do echo 'Waiting for Grafana...'; sleep 5; done; echo 'Grafana is healthy'"
      args:
        chdir: /root
      ignore_errors: true
    
    - name: Wait for Uptime Kuma to respond
      shell: timeout 120 bash -c "until curl -s -f http://localhost:3001 >/dev/null 2>&1; do echo 'Waiting for Uptime Kuma...'; sleep 5; done; echo 'Uptime Kuma is responding'"
      args:
        chdir: /root
      ignore_errors: true
