- name: Initialize proxmox host to the state expected by terraform
  hosts: proxmox
  gather_facts: false
  vars:
    # Lab VLAN. The host has no address on the monitoring VLAN; Prometheus
    # scrapes it here instead, which is why firewall_base.tf allows it.
    pve_mgmt_vlan: 30
    pve_mgmt_address: 10.0.30.2/24
    pve_mgmt_gateway: 10.0.30.1
    disks: {
      "USB-HDD": "/dev/disk/by-uuid/d10e88e6-9a20-4d5f-972f-c432c26f9019",
      "USB-SSD": "/dev/disk/by-uuid/c06ebfa7-0bf3-4751-87c4-19c5f0c3515f",
      "USB-BITCOIN": "/dev/disk/by-uuid/fcadd3af-add3-4a92-a1d7-6abe1b265abf",
      "USB-BITCOIN-APPS": "/dev/disk/by-uuid/9fa5a1fb-a536-41c0-be36-1a55edb84737",
    }
    storage: {
      "USB-HDD": {
        "type": "dir",
        "path": "/mnt/USB-HDD",
        "content": "images,rootdir,vztmpl,snippets"
      },
      "USB-SSD": {
        "type": "dir",
        "path": "/mnt/USB-SSD",
        "content": "images,rootdir,vztmpl,snippets"
      }
    }
    required_directories: [
      "/mnt/USB-SSD/ssl",
      "/mnt/USB-SSD/backup",
      "/mnt/USB-SSD/downloads",
      "/mnt/USB-SSD/cache",
      "/mnt/USB-HDD/jellyfin-media",
      "/mnt/USB-SSD/monitoring-cold",
      "/mnt/USB-SSD/monitoring-cold/thanos",
      "/mnt/USB-SSD/monitoring-cold/influxdb",
      "/mnt/USB-SSD/monitoring-cold/loki"
    ]

  roles:
    - role: node_exporter
    - role: promtail

  tasks:
    # Guards the host's default route. Was an untracked script on the host that
    # bounced vmbr0 with `ip link`, dropping the ifupdown-configured gateway
    # permanently; see configs/pve/net-watchdog.sh.
    - name: Deploy net-watchdog script
      ansible.builtin.copy:
        src: "../../../configs/pve/net-watchdog.sh"
        dest: /usr/local/bin/net-watchdog.sh
        owner: root
        group: root
        mode: '0755'

    - name: Remove any unmanaged net-watchdog crontab entry
      ansible.builtin.shell: |
        crontab -l 2>/dev/null | grep -v 'net-watchdog' | crontab - || true
      changed_when: false

    - name: Schedule net-watchdog
      ansible.builtin.cron:
        name: net-watchdog
        job: /usr/local/bin/net-watchdog.sh
        minute: "*"
        state: present

    - name: Create mount points
      ansible.builtin.file:
        name: "/mnt/{{ item.key }}"
        state: directory
      with_dict: "{{ disks }}"
    - name: Make sure the disks are in fstab and mounted
      ansible.builtin.mount:
        name: "/mnt/{{ item.key }}"
        src: "{{ item.value }}"
        fstype: "{% if item.key == 'USB-BITCOIN' %}xfs{% else %}ext4{% endif %}"
        state: present
        opts: "noatime,nodiratime,nofail,{% if item.key == 'USB-BITCOIN' %}logbufs=8,logbsize=256k,allocsize=64m{% else %}data=journal,commit=30{% endif %}"
      with_dict: "{{ disks }}"
      notify: reload systemd
    - name: Run mount -a
      ansible.builtin.shell:
        cmd: mount -a
      notify: reload systemd
    - name: Remove storage from the cluster only if it exists
      ansible.builtin.shell:
        cmd: pvesm list {{ item.key }} && pvesm remove {{ item.key }}
      with_dict: "{{ storage }}"
      register: remove_storage
      failed_when: remove_storage.rc == 1
    - name: Add storage to cluster as a directory
      ansible.builtin.shell:
        cmd: pvesm add dir {{ item.key }} --path {{ item.value.path }} --content {{ item.value.content }}
      with_dict: "{{ storage }}"
      notify: reload systemd
    - name: Create required directories
      ansible.builtin.file:
        name: "{{ item }}"
        state: directory
        owner: 101000
        group: 101000
      with_items: "{{ required_directories }}"
    # The DMZ used to be a separate, untagged bridge. It is now VLAN 40 on the
    # VLAN-aware vmbr0, so vmbr1 has no purpose. Removing the file does not tear
    # the bridge down on a running host -- that needs `ifdown vmbr1` by hand,
    # which is deliberately not automated while containers may still be on it.
    - name: "Remove the obsolete DMZ bridge definition"
      ansible.builtin.file:
        path: /etc/network/interfaces.d/vmbr1.cfg
        state: absent

    # Memory tuning. Must stay ahead of the vmbr0 assert below, which fails
    # by design until the flat-LAN failsafe is removed. Run on its own with
    # `--tags memory`; a full run drops and re-adds the USB storages.

    - name: "Enable zswap at runtime"
      # sysfs rejects copy/lineinfile's atomic rename, so write directly.
      # compressor before enabled, so the pool is created with zstd.
      ansible.builtin.shell: |
        set -eu
        changed=0
        apply() {
          if [ "$(cat "$1")" != "$2" ]; then
            echo "$2" > "$1"
            changed=1
          fi
        }
        apply /sys/module/zswap/parameters/compressor zstd
        apply /sys/module/zswap/parameters/max_pool_percent 20
        apply /sys/module/zswap/parameters/enabled Y
        echo "changed=${changed}"
      register: pve_zswap_runtime
      changed_when: "'changed=1' in pve_zswap_runtime.stdout"
      tags: [memory]

    - name: "Persist zswap on the kernel command line"
      # The sysfs writes above cover the running host; this survives a reboot.
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: >-
          GRUB_CMDLINE_LINUX_DEFAULT="quiet zswap.enabled=1
          zswap.compressor=zstd zswap.max_pool_percent=20"
        mode: "0644"
      notify: update grub
      tags: [memory]

    # ksmtuned counts only qemu PSS as committed, so it cannot see the LXCs
    # using most of this host's RAM. It stops KSM while
    # `committed + thres < total AND free > thres`; at the default coef of 20
    # both hold and KSM idles at run=0 with 200 MB free. 40 breaks the second.
    - name: "Make ksmtuned account for non-qemu memory pressure"
      ansible.builtin.lineinfile:
        path: /etc/ksmtuned.conf
        regexp: '^#?\s*KSM_THRES_COEF='
        line: "KSM_THRES_COEF=40"
        mode: "0644"
      notify: restart ksmtuned
      tags: [memory]

    # The management address moves off vmbr0 itself and onto a VLAN 30
    # subinterface. Leaving the old address in place would give the host two
    # default routes, so refuse to run rather than half-apply it. This is the
    # one change that can strand the host, and it is expected to be made from
    # the console before this playbook is run.
    - name: "Read /etc/network/interfaces"
      ansible.builtin.slurp:
        src: /etc/network/interfaces
      register: pve_interfaces

    - name: "Assert the legacy flat-LAN address has been removed from vmbr0"
      ansible.builtin.assert:
        that:
          - "'10.0.0.2' not in (pve_interfaces.content | b64decode)"
        fail_msg: >-
          /etc/network/interfaces still assigns 10.0.0.2 to vmbr0. Remove that
          address and its gateway from the vmbr0 stanza (from the console),
          then re-run. Leaving it results in two default routes.

    - name: "Ensure vmbr0 is VLAN-aware"
      ansible.builtin.lineinfile:
        path: /etc/network/interfaces
        regexp: '^\s*bridge-vlan-aware\s'
        line: "\tbridge-vlan-aware yes"
        insertafter: '^iface vmbr0 inet'

    - name: "Ensure vmbr0 trunks the VLANs in use"
      ansible.builtin.lineinfile:
        path: /etc/network/interfaces
        regexp: '^\s*bridge-vids\s'
        line: "\tbridge-vids 30 40 50"
        insertafter: '^\s*bridge-vlan-aware yes'

    - name: "Define the VLAN 30 management interface"
      ansible.builtin.copy:
        content: |
          auto vmbr0.{{ pve_mgmt_vlan }}
          iface vmbr0.{{ pve_mgmt_vlan }} inet static
          	address {{ pve_mgmt_address }}
          	gateway {{ pve_mgmt_gateway }}
        dest: /etc/network/interfaces.d/vmbr0-mgmt.cfg
        mode: "0644"


  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: update grub
      ansible.builtin.command: update-grub
      changed_when: true
      tags: [memory]

    - name: restart ksmtuned
      ansible.builtin.systemd:
        name: ksmtuned
        state: restarted
      tags: [memory]
