version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.max-block-duration=2h'
      - '--storage.tsdb.min-block-duration=2h'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "0.0.0.0:9090:9090"
    networks:
      - monitoring

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    restart: unless-stopped
    user: "0:0"  # Run as root to avoid permission issues
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "0.0.0.0:3100:3100"
    networks:
      - monitoring

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UPTIME_KUMA_DATA_DIR=/app/data
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "0.0.0.0:3001:3001"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme123}
      - GF_INSTALL_PLUGINS=  # Remove deprecated angular plugin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  # Optional: blackbox exporter for external service monitoring
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/monitoring-cold/prometheus
  loki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/monitoring-cold/loki
  uptime-kuma-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/monitoring-cold/uptime-kuma
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/monitoring-cold/grafana
