version: '3.8'

services:
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=0.0.0.0:9093'
      - '--web.external-url=http://alertmanager:9093/'
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "0.0.0.0:9093:9093"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.max-block-duration=2h'
      - '--storage.tsdb.min-block-duration=2h'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "0.0.0.0:9090:9090"
    networks:
      - monitoring
    depends_on:
      - alertmanager

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    restart: unless-stopped
    user: "0:0"  # Run as root to avoid permission issues
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    ports:
      - "0.0.0.0:3100:3100"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      - HOSTNAME=monitoring-host
    networks:
      - monitoring
    depends_on:
      - loki

  gatus:
    image: ghcr.io/twin/gatus:stable
    container_name: gatus
    restart: unless-stopped
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - gatus-data:/data
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - monitoring
    # No healthcheck: the Gatus image is distroless (no shell, no wget, no curl),
    # so any CMD healthcheck would fail permanently and pin the container to
    # "unhealthy". Liveness is covered externally instead - Prometheus scrapes it
    # as job "gatus" and the GatusDown rule fires on up{job="gatus"} == 0.

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme123}
      - GF_INSTALL_PLUGINS=  # Remove deprecated angular plugin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/config.ini:/etc/grafana/grafana.ini:ro
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki


networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  gatus-data:
  grafana-data:
  alertmanager-data:
