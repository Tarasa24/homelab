auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
    shared_store: filesystem

  filesystem:
    directory: /loki/chunks
  
ingester:
  wal:
    dir: /loki/wal
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_entries_limit_per_query: 5000
  retention_period: 168h
  max_queriers_per_tenant: 10
  query_timeout: 2m

query_scheduler:
  max_outstanding_requests_per_tenant: 2048

querier:
  max_concurrent: 20

chunk_store_config:
  max_look_back_period: 0s

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  retention_enabled: true

ruler:
  enable_api: true
  # rule_path is scratch space the ruler writes to while evaluating, so it must
  # live on the writable named volume. storage.local.directory is where rule
  # FILES are read from, and is a read-only bind mount of the repo. Pointing both
  # at the same path is what previously required nesting a bind mount inside the
  # loki-data volume; keeping them separate avoids that entirely.
  rule_path: /loki/rules-tmp
  alertmanager_url: http://alertmanager:9093
  external_labels:
    cluster: 'homelab'
    environment: 'production'
  storage:
    type: local
    local:
      # Loki appends the tenant id, so actual rules are read from
      # /etc/loki/rules/fake/ (tenant is "fake" because auth_enabled is false).
      directory: /etc/loki/rules
