# Loki ruler alert rules.
#
# Path matters: with auth_enabled=false Loki uses the single tenant "fake", and
# the local ruler storage backend expects rules under <directory>/<tenant>/.
# This file therefore has to live in a "fake" subdirectory. Previously the file
# sat at configs/monitoring/loki/loki-alerts.yml and was never mounted into the
# container at all, so the ruler ran with zero rules and every log alert below
# was inert.
#
# The `job` label is "<instance>/<service_name>" (set in the promtail configs),
# e.g. "private-docker-host/authelia". Selectors that match a bare service name
# match nothing - that silently disabled two of these rules.
#
# Two traps these rules previously fell into, both now guarded against:
#
#   1. Self-reference. Loki's ruler logs the text of every query it evaluates,
#      and promtail ships Loki's own logs back into Loki. A rule searching for
#      "oom.?kill" therefore matched the ruler log line containing that very
#      pattern, and OOMKill fired permanently against job="monitoring/loki".
#      Every broad rule below excludes monitoring/loki and monitoring/promtail.
#
#   2. Substring matches. A bare `error` pattern matches "errors=0", which Gatus
#      prints on every successful probe, so a healthy service tripped
#      ContainerErrors. Patterns now use \b word boundaries.
#
# Scope note: these are log-CONTENT rules. They cannot detect a service being
# down, because a dead service emits no log lines and count_over_time() then
# returns an empty vector. Down-detection is Gatus (ExternalServiceDown) and
# cAdvisor (ContainerDown); do not try to duplicate it here.

groups:
  - name: loki_alerts
    rules:
      # Broad error-rate canary across every stream. Threshold is deliberately
      # high: several services log routine errors, and a low bar here is the
      # classic source of alert fatigue. Tune per-service if one job dominates.
      - alert: ContainerErrors
        expr: |
          sum by (job) (
            count_over_time({job=~".+", job!~"monitoring/(loki|promtail)"} |~ `(?i)\b(error|fatal|panic|exception)\b` [5m])
          ) > 25
        for: 5m
        labels:
          severity: warning
          alerttype: service
        annotations:
          summary: "{{ $labels.job }} is logging a lot of errors"
          description: "{{ $labels.job }} logged more than 25 error/fatal/panic lines in 5 minutes"

      - alert: ContainerCrashLoop
        expr: |
          sum by (job) (
            count_over_time({job=~".+", job!~"monitoring/(loki|promtail)"} |~ `(?i)\b(fatal|panic)\b` [5m])
          ) > 50
        for: 2m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "{{ $labels.job }} may be crash looping"
          description: "{{ $labels.job }} logged more than 50 fatal/panic lines in 5 minutes"

      # Was {job="authelia"}, which never matched anything.
      - alert: AuthenticationFailureSpike
        expr: |
          sum by (job) (
            count_over_time({job="private-docker-host/authelia"} |~ `(?i)(authentication failed|invalid credentials|user not found|brute.?force)` [5m])
          ) > 10
        for: 2m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "Authelia authentication failure spike"
          description: "More than 10 authentication failures in 5 minutes - possible brute force attempt"

      - alert: BackupJobFailed
        expr: |
          sum by (job) (
            count_over_time({job=~".+", job!~"monitoring/(loki|promtail)"} |~ `(?i)(borgmatic|borg|restic)` |~ `(?i)\b(error|failed|exception)\b` [1h])
          ) > 0
        for: 5m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Backup error logged on {{ $labels.job }}"
          description: "A borg/borgmatic/restic error appeared in the logs of {{ $labels.job }} within the last hour"

      - alert: OOMKill
        expr: |
          sum by (job) (
            count_over_time({job=~".+", job!~"monitoring/(loki|promtail)"} |~ `(?i)(out of memory|oom.?kill|killed process)` [5m])
          ) > 0
        for: 0m
        labels:
          severity: critical
          alerttype: infrastructure
        annotations:
          summary: "OOM kill detected in {{ $labels.job }}"
          description: "An out-of-memory kill appeared in the logs of {{ $labels.job }} - check container memory limits"

      # Was {job=~"(traefik|nginx|dmz-router)"}, which never matched anything.
      # Real proxy job today is "dmz-router/nginx"; the regex also tolerates a
      # traefik stream appearing later.
      - alert: TLSCertExpiryWarningInLogs
        expr: |
          sum by (job) (
            count_over_time({job=~".*/(nginx|traefik)"} |~ `(?i)(certificate.*expir|ssl.*expir|cert.*expir)` [1h])
          ) > 0
        for: 5m
        labels:
          severity: warning
          alerttype: service
        annotations:
          summary: "TLS certificate expiry warning in {{ $labels.job }} logs"
          description: "The proxy logged a certificate expiry warning - check certbot renewal on the DMZ router"

      # Proxy 5xx rates. nginx promotes `status` and `server_name` to stream
      # labels (see configs/promtail/dmz-router.yaml), so this is a cheap label
      # filter with no parsing. Grouping by server_name makes the alert name the
      # affected site directly.
      - alert: NginxErrorRateHigh
        expr: |
          sum by (server_name) (
            count_over_time({job="dmz-router/nginx", status=~"5.."}[5m])
          ) > 10
        for: 5m
        labels:
          severity: warning
          alerttype: service
          host: dmz-router
        annotations:
          summary: "{{ $labels.server_name }} is returning 5xx errors"
          description: "More than 10 5xx responses in 5 minutes for {{ $labels.server_name }} - the backend behind the DMZ router is likely failing"

      # Traefik logs JSON access lines but also plain-text startup lines, so the
      # json parser errors on those; | __error__="" drops them instead of
      # failing the whole query. The field is DownstreamStatus (what the client
      # got), not OriginStatus.
      - alert: TraefikErrorRateHigh
        expr: |
          sum(
            count_over_time({job="private-docker-host/traefik"} | json | __error__="" | DownstreamStatus>=500 [5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
          alerttype: service
          host: private-docker-host
        annotations:
          summary: "Traefik is returning 5xx errors on the LAN"
          description: "More than 5 5xx responses in 5 minutes through Traefik - an internal service behind it is likely failing"

      # Log shipping health. Promtail dying is silent by design - the absence of
      # logs looks identical to a quiet host - and that is exactly how backup and
      # dns shipped nothing from the 2026-05-31 reboot until 2026-08-04 without
      # anyone noticing. absent_over_time on the per-host `instance` label
      # catches it regardless of cause (agent dead, config broken, network gone),
      # and does not depend on scraping promtail's own port, which would need a
      # firewall rule on the DMZ router.
      #
      # The 2h window is sized off the quietest host: backup only emits ~21
      # syslog lines an hour. absent_over_time drops all labels, so each rule
      # carries its host statically, same pattern as ContainerDown.
      - alert: LogShippingStopped
        expr: absent_over_time({instance="backup"}[2h])
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
          host: backup
        annotations:
          summary: "No logs received from backup for 2 hours"
          description: "Promtail on backup has stopped shipping to Loki - log-based alerting is blind for this host"

      - alert: LogShippingStopped
        expr: absent_over_time({instance="dns"}[2h])
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
          host: dns
        annotations:
          summary: "No logs received from dns for 2 hours"
          description: "Promtail on dns has stopped shipping to Loki - log-based alerting is blind for this host"

      - alert: LogShippingStopped
        expr: absent_over_time({instance="dmz-router"}[2h])
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
          host: dmz-router
        annotations:
          summary: "No logs received from dmz-router for 2 hours"
          description: "Promtail on dmz-router has stopped shipping to Loki - log-based alerting is blind for this host"

      - alert: LogShippingStopped
        expr: absent_over_time({instance="private-docker-host"}[2h])
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
          host: private-docker-host
        annotations:
          summary: "No logs received from private-docker-host for 2 hours"
          description: "Promtail on private-docker-host has stopped shipping to Loki - log-based alerting is blind for this host"

      - alert: LogShippingStopped
        expr: absent_over_time({instance="dmz-docker-host"}[2h])
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
          host: dmz-docker-host
        annotations:
          summary: "No logs received from dmz-docker-host for 2 hours"
          description: "Promtail on dmz-docker-host has stopped shipping to Loki - log-based alerting is blind for this host"

      - alert: LogShippingStopped
        expr: absent_over_time({instance="monitoring"}[2h])
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
          host: monitoring
        annotations:
          summary: "No logs received from monitoring for 2 hours"
          description: "Promtail on monitoring has stopped shipping to Loki - log-based alerting is blind for this host"
