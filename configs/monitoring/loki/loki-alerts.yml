groups:
  - name: loki_alerts
    rules:
      # Critical: Container crash loops
      - alert: ContainerCrashLoop
        expr: |
          count by (job) (
            count_over_time({job!=""} | json | level="ERROR" | pattern="(OOMKilled|killed|Exited)" [5m])
          ) > 5
        for: 2m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "{{ $labels.job }} experiencing crash loop"
          description: "Service {{ $labels.job }} has crashed >5 times in 5 minutes"

      # Critical: Authentication failures spike
      - alert: AuthenticationFailureSpike
        expr: |
          rate({job="authelia"} | json | level="WARNING" | pattern="authentication failed" [5m]) > 0.5
        for: 2m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "Authelia experiencing auth failure spike"
          description: "Auth failures >0.5/sec (possible brute-force attack)"

      # Warning: Backup failures
      - alert: BackupJobFailed
        expr: |
          count_over_time({job=~"(borg|restic|backup)"} | json | level="ERROR" [1h]) > 0
        for: 5m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Backup job encountered errors"
          description: "{{ $labels.job }} logged errors in last hour"

      # Warning: High disk I/O wait
      - alert: HighDiskIOWait
        expr: |
          count_over_time({job=~".*"} | pattern="iowait.*([5-9][0-9]|100)" [5m]) > 10
        for: 5m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "High disk I/O wait detected"
          description: "System spending >50% time in iowait"

      # Warning: Certificate expiry alerts in Traefik
      - alert: TLSCertificateExpiryWarning
        expr: |
          count_over_time({job=~"(traefik|dmz-router)"} | pattern="certificate.*expires.*([1-2][0-9]|3[0]).*day" [1h]) > 0
        for: 5m
        labels:
          severity: warning
          alerttype: service
        annotations:
          summary: "TLS certificate expiring soon"
          description: "Certificate expiry warning detected in logs"

      # Warning: High error rate in services
      - alert: HighErrorRateInService
        expr: |
          rate({job=~"(jellyfin|immich|traefik)"} | json | level="ERROR" [5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          alerttype: external
        annotations:
          summary: "{{ $labels.job }} high error rate"
          description: "Service {{ $labels.job }} logging errors at >0.1/sec"

      # Warning: Repeated connection errors in DMZ services
      - alert: ServiceConnectionErrors
        expr: |
          rate({job=~"(jellyfin|immich)"} | pattern="connection refused|timeout|connection reset" [5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          alerttype: external
        annotations:
          summary: "{{ $labels.job }} connection errors"
          description: "Service {{ $labels.job }} showing connection errors"
