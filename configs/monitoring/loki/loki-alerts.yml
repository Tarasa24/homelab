groups:
  - name: loki_alerts
    rules:
      # Container logs error/fatal/panic lines
      - alert: ContainerErrors
        expr: |
          sum by (job) (
            count_over_time({job!=""} |~ `(?i)(error|fatal|panic|exception|critical)` [5m])
          ) > 10
        for: 2m
        labels:
          severity: warning
          alerttype: service
        annotations:
          summary: "{{ $labels.job }} logging errors"
          description: "{{ $labels.job }} has logged >10 error/fatal/panic lines in 5 minutes"

      # Container crash loop (container restart detected via log gaps + error burst)
      - alert: ContainerCrashLoop
        expr: |
          sum by (job) (
            count_over_time({job!=""} |~ `(?i)(error|fatal|panic)` [5m])
          ) > 50
        for: 1m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "{{ $labels.job }} crash looping"
          description: "{{ $labels.job }} has logged >50 errors in 5 minutes - likely crash looping"

      # Authentication failures (authelia)
      - alert: AuthenticationFailureSpike
        expr: |
          count_over_time({job="authelia"} |~ `(?i)(authentication failure|invalid credentials|brute.force)` [5m]) > 10
        for: 2m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "Authelia: authentication failure spike"
          description: "More than 10 auth failures in 5 minutes - possible brute force"

      # Backup errors
      - alert: BackupJobFailed
        expr: |
          count_over_time({job=~".+"} |~ `(?i)(borgmatic|borg|restic)` |~ `(?i)(error|failed|exception)` [1h]) > 0
        for: 5m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Backup job failed"
          description: "Backup error detected in logs"

      # OOM kills
      - alert: OOMKill
        expr: |
          count_over_time({job!=""} |~ `(?i)(out of memory|oom.kill|killed process|memory limit)` [5m]) > 0
        for: 0m
        labels:
          severity: critical
          alerttype: infrastructure
        annotations:
          summary: "OOM kill detected in {{ $labels.job }}"
          description: "Out of memory kill detected - check container memory limits"

      # TLS cert expiry warnings from nginx/traefik logs
      - alert: TLSCertExpiryWarning
        expr: |
          count_over_time({job=~"(traefik|nginx|dmz-router)"} |~ `(?i)(certificate.*expir|ssl.*expir|cert.*expir)` [1h]) > 0
        for: 5m
        labels:
          severity: warning
          alerttype: service
        annotations:
          summary: "TLS certificate expiring soon"
          description: "Certificate expiry warning in {{ $labels.job }} logs"
