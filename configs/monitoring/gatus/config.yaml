  # Infrastructure - the monitoring stack itself, over the compose network.
  # Gatus does not probe itself; the GatusDown Prometheus rule covers that.
  - name: "Prometheus"
    group: "Infrastructure"
    url: "http://prometheus:9090/-/healthy"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
