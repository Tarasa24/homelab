  - name: "Bazarr"
    group: "Internal"
    url: "http://10.0.1.23:6767/ping"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: internal

  - name: "qBittorrent"
    group: "Internal"
    url: "http://10.0.1.23:8080/"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == any(200, 301, 302, 401)"
    ui:
      hide-url: true
