# Service availability probing + the public status page at
# status.homelab.tarasa24.dev. Alerting is not configured here on purpose:
# Prometheus scrapes the metrics and Alertmanager owns routing to ntfy.
#
# The page is public, so internal endpoints hide url/hostname/port/errors - a
# failed probe would otherwise leak internal topology in its error string.

web:
  port: 8080

storage:
  type: sqlite
  path: /data/gatus.db

metrics: true

ui:
  title: "Homelab Status"
  header: "Homelab Status"
  description: "Live availability of homelab services."

endpoints:
  # Public - the real end-user path via Linode/WireGuard/nginx. Includes the WAN
  # uplink, so a failure here does not isolate the fault; compare with Internal.
  - name: "Jellyfin"
    group: "Public"
    url: "https://jellyfin.homelab.tarasa24.dev/health"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      # Cert expiry is not a condition here: TLSCertificateExpiringSoon alerts
      # on the exported metric instead, so a renewal-due cert does not paint
      # this endpoint as down on the public page.
      - "[STATUS] == 200"
    ui:
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: dmz-docker-host
      path: external

  - name: "Immich"
    group: "Public"
    url: "https://immich.homelab.tarasa24.dev/api/server/ping"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: dmz-docker-host
      path: external

  - name: "ntfy"
    group: "Public"
    url: "https://ntfy.homelab.tarasa24.dev/v1/health"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: dmz-docker-host
      path: external

  - name: "Calendar & Contacts"
    group: "Public"
    url: "https://cal.homelab.tarasa24.dev/"
    interval: 60s
    client:
      ignore-redirect: true
      timeout: 10s
    conditions:
      # Auth-gated behind Authelia; a redirect or 401 still proves that nginx,
      # the TLS termination and Authelia are all alive.
      - "[STATUS] == any(200, 301, 302, 401)"
    ui:
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: dmz-docker-host
      path: external

  - name: "Authelia"
    group: "Public"
    url: "https://auth.homelab.tarasa24.dev/api/health"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == any(200, 401)"
    ui:
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: external

  # TCP connect, not HTTP - the Electrum protocol is not HTTP.
  - name: "Electrum Server"
    group: "Public"
    url: "tcp://electrum.homelab.tarasa24.dev:50002"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[CONNECTED] == true"
    ui:
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: dmz-bitcoin-node
      path: external

  # Internal - probed directly over the LAN, bypassing the WAN. If Public fails
  # but Internal passes, the fault is in the WAN/nginx path, not the service.
  - name: "Traefik"
    group: "Internal"
    # /ping is not enabled here; the insecure API on :8080 is.
    url: "http://10.0.30.20:8080/api/overview"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: internal

  - name: "Authelia (LAN)"
    group: "Internal"
    url: "http://10.0.30.21:9091/api/health"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == any(200, 401)"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: internal

  - name: "Vaultwarden"
    group: "Internal"
    url: "http://10.0.30.22:80/alive"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: internal

  - name: "Firefly III"
    group: "Internal"
    url: "http://10.0.30.24:8051/"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == any(200, 301, 302, 401)"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: internal

  # Queries a public name so the check covers recursion, not just liveness.
  - name: "DNS"
    group: "Internal"
    url: "10.0.30.11"
    interval: 60s
    dns:
      query-name: "google.com"
      query-type: "A"
    client:
      timeout: 10s
    conditions:
      - "[DNS_RCODE] == NOERROR"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: dns
      path: internal

  # Reachable over VLAN 50, unlike electrs which binds its DMZ address only.
  - name: "Bitcoin Node"
    group: "Internal"
    url: "tcp://10.0.50.103:8333"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[CONNECTED] == true"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: dmz-bitcoin-node
      path: internal

  - name: "Ghostfolio"
    group: "Internal"
    url: "http://10.0.30.26:3333/api/v1/health"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: internal

  - name: "Kimai"
    group: "Internal"
    url: "http://10.0.30.27:8001/"
    interval: 60s
    # Symfony's TRUSTED_HOSTS check 400s a raw-IP Host header, so the probe
    # sends the real vhost to get a genuine response (redirect to login).
    headers:
      Host: "kimai.lan.tarasa24.dev"
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == any(200, 301, 302, 401)"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: internal

  - name: "Unifi Controller"
    group: "Internal"
    url: "https://10.0.30.25:8443/"
    interval: 60s
    client:
      # Unifi serves its own self-signed cert on :8443.
      insecure: true
      timeout: 10s
    conditions:
      - "[STATUS] == any(200, 301, 302, 401)"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: internal

  - name: "Sonarr"
    group: "Internal"
    url: "http://10.0.30.23:8989/ping"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: private-docker-host
      path: internal

  - name: "Radarr"
