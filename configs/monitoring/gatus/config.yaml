      path: internal

  # ---------------------------------------------------------------------------
  # Infrastructure - the monitoring stack itself, probed over the compose
  # network by service name. Note Gatus does not probe itself: if Gatus is down
  # the GatusDown Prometheus rule (up{job="gatus"} == 0) covers it.
  # ---------------------------------------------------------------------------
  - name: "Prometheus"
    group: "Infrastructure"
    url: "http://prometheus:9090/-/healthy"
    interval: 60s
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
    ui:
      hide-url: true
      hide-hostname: true
      hide-port: true
      hide-conditions: true
      hide-errors: true
    extra-labels:
      host: monitoring
      path: internal

  - name: "Loki"
    group: "Infrastructure"
    url: "http://loki:3100/ready"
    interval: 60s
    client:
      timeout: 10s
    conditions:
