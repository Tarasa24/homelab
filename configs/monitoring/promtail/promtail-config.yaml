server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker labels-based scraping
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        labels:
          __host: 'docker-host'
    relabel_configs:
      # Extract service name from container label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'job'
      # Extract container name
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      # Add environment label (dmz or lan)
      - source_labels: ['__meta_docker_container_label_environment']
        target_label: 'environment'
        regex: '(.*)'
        replacement: '${1}'
      # Add severity detection (parse container name for criticality)
      - source_labels: ['job']
        target_label: 'severity'
        regex: '(traefik|jellyfin|immich|authelia|vaultwarden|backup|prometheus|alertmanager|loki)'
        replacement: 'critical'
      - source_labels: ['severity']
        regex: '^$'
        replacement: 'info'
      # Add stream label (stdout/stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
