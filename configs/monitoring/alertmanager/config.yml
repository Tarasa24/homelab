global:
  resolve_timeout: 5m
  # Slack/email/etc. can be configured here if needed

route:
  receiver: 'default'
  group_by: ['severity', 'alerttype', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  
  routes:
    # Critical infrastructure alerts → critical topic
    - match:
        severity: critical
        alerttype: infrastructure
      receiver: 'critical-receiver'
      continue: true
    
    # Critical service alerts → critical topic
    - match:
        severity: critical
        alerttype: service
      receiver: 'critical-receiver'
      continue: true
    
    # Storage warnings → storage topic
    - match:
        alerttype: storage
      receiver: 'storage-receiver'
      continue: true
    
    # Service degradation → services topic
    - match:
        alerttype: service
      receiver: 'services-receiver'
      continue: true
    
    # External service alerts → external topic
    - match:
        external: 'true'
      receiver: 'external-receiver'
      continue: true

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/'

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://10.1.0.24:8080/homelab-critical'
        send_resolved: true

  - name: 'storage-receiver'
    webhook_configs:
      - url: 'http://10.1.0.24:8080/homelab-storage'
        send_resolved: true

  - name: 'services-receiver'
    webhook_configs:
      - url: 'http://10.1.0.24:8080/homelab-services'
        send_resolved: true

  - name: 'external-receiver'
    webhook_configs:
      - url: 'http://10.1.0.24:8080/homelab-external'
        send_resolved: true

inhibit_rules:
  # Don't alert on service down if the node is already down
  - source_match:
      severity: 'critical'
      alerttype: 'infrastructure'
    target_match:
      alerttype: 'service'
    equal: ['instance']
