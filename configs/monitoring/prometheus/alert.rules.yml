groups:
  - name: node_alerts
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
          alerttype: infrastructure
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been unreachable for more than 2 minutes"

      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "High memory on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      # /media and /immich are USB bulk storage (one disk, surfaced into several
      # LXCs) and are expected to run close to full. Excluded here only;
      # DiskSpaceCritical still covers them.
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint!~"/media|/immich|/mnt/USB.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint!~"/media|/immich|/mnt/USB.*"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Low disk space on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Only {{ $value | printf \"%.1f\" }}% free on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 5
        for: 5m
        labels:
          severity: critical
          alerttype: storage
        annotations:
          summary: "Critical disk space on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Only {{ $value | printf \"%.1f\" }}% free on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: DiskReadingErrors
        expr: rate(node_disk_read_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Disk read errors on {{ $labels.instance }}"
          description: "Device {{ $labels.device }} on {{ $labels.instance }} is reporting read errors"

      # 15m gives net-watchdog's own cooldown-gated ifreload retries a fair
      # chance to self-heal before paging.
      - alert: NetWatchdogGatewayUnreachable
        expr: net_watchdog_gateway_reachable == 0
        for: 15m
        labels:
          severity: critical
          alerttype: infrastructure
        annotations:
          summary: "net-watchdog gateway unreachable on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has reported its default gateway ({{ $labels.interface }}) unreachable for over 15 minutes, and ifreload -a has not fixed it"

      # Detects the watchdog itself not running (cron died, etc.), which the
      # alert above can't catch since it depends on the metric existing.
      - alert: NetWatchdogStale
        expr: time() - net_watchdog_last_run_timestamp_seconds > 300
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "net-watchdog hasn't reported in on {{ $labels.instance }}"
          description: "No net-watchdog metric update from {{ $labels.instance }} in over 5 minutes -- the cron job or script itself may have stopped"

  - name: service_alerts
    rules:
      - alert: DockerDaemonDown
        expr: up{job="docker"} == 0
        for: 3m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "Docker daemon unreachable on {{ $labels.instance }}"
          description: "Docker metrics endpoint on {{ $labels.instance }} has been down for 3 minutes"

  - name: prometheus_alerts
    rules:
      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "Prometheus target missing: {{ $labels.instance }}"
          description: "Scrape target {{ $labels.job }}/{{ $labels.instance }} has been down for 5 minutes"

      # PrometheusStorageFull removed: its expression was not a fill ratio of
      # anything and fired on a healthy TSDB. Retention is bounded by
      # --storage.tsdb.retention.size and disk pressure by DiskSpaceLow.

  - name: availability_alerts
    rules:
      # The Gatus docs describe gatus_check_result_total and gatus_uptime;
      # neither exists in the shipped binary. Re-verify against live /metrics
      # after any upgrade - a renamed metric silently disables this alert.
      - alert: ExternalServiceDown
        expr: gatus_results_endpoint_success == 0
        # 60s probe + 60s scrape + 2m hold => roughly 3-4 minutes to page.
        for: 2m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.group }}) is down"
          description: "Gatus probe for {{ $labels.name }} in group {{ $labels.group }} has been failing for more than 2 minutes on {{ $labels.host }} via the {{ $labels.path }} path"

      # All public vhosts share one wildcard cert, so this fires once per
      # endpoint; alertmanager groups them into a single notification.
      - alert: TLSCertificateExpiringSoon
        expr: gatus_results_certificate_expiration_seconds > 0 and gatus_results_certificate_expiration_seconds < 604800
        for: 1h
        labels:
          severity: warning
          alerttype: service
        annotations:
          summary: "TLS certificate for {{ $labels.name }} expires in under 7 days"
          description: "The certificate served for {{ $labels.name }} ({{ $labels.group }}) expires in {{ $value | humanizeDuration }}; check that certbot renewal on the DMZ router is working"

      - alert: GatusDown
        expr: up{job="gatus"} == 0
        for: 3m
        labels:
          severity: critical
          alerttype: infrastructure
          # Set here, not on the scrape target: a host label on the gatus job
          # would collide with the per-endpoint one and be renamed
          # exported_host, breaking the inhibit rules.
          host: monitoring
        annotations:
          summary: "Gatus is down"
          description: "Prometheus has been unable to scrape Gatus for more than 3 minutes; service availability probing is blind"

  - name: systemd_alerts
    rules:
      # Service-level coverage for the non-Docker hosts. The name selector is
      # load-bearing: without it this matches every oneshot unit that is
      # legitimately inactive (apt-daily, e2scrub_all, ...) - 134 pending alerts
      # in practice. Cannot detect a unit removed entirely, only one not active.
      - alert: SystemdUnitDown
        expr: node_systemd_unit_state{state="active", name=~"(bitcoind|electrs|pve-cluster|pvedaemon|pveproxy|pvestatd|pve-firewall)\\.service"} == 0
        for: 5m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "{{ $labels.name }} is not running on {{ $labels.host }}"
          description: "systemd reports {{ $labels.name }} as not active on {{ $labels.host }} for more than 5 minutes"

  - name: container_alerts
    rules:
      - alert: CAdvisorDown
        expr: up{job="cadvisor"} == 0
        for: 3m
        labels:
          severity: critical
          alerttype: infrastructure
        annotations:
          summary: "cAdvisor unreachable on {{ $labels.instance }}"
          description: "cAdvisor metrics endpoint on {{ $labels.instance }} has been down for 3 minutes; container-level alerting is blind while this is firing"

      - alert: ContainerDown
        expr: absent_over_time(container_last_seen{name="ntfy"}[10m])
        for: 5m
        labels:
          severity: critical
          alerttype: service
          host: dmz-docker-host
          container: ntfy
        annotations:
          summary: "Container ntfy has disappeared"
          description: "cAdvisor has not seen container ntfy on dmz-docker-host for 10 minutes"

