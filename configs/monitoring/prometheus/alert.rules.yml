groups:
  - name: node_alerts
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
          alerttype: infrastructure
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been unreachable for more than 2 minutes"

      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "High memory on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Low disk space on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Only {{ $value | printf \"%.1f\" }}% free on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 5
        for: 5m
        labels:
          severity: critical
          alerttype: storage
        annotations:
          summary: "Critical disk space on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Only {{ $value | printf \"%.1f\" }}% free on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: DiskReadingErrors
        expr: rate(node_disk_read_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Disk read errors on {{ $labels.instance }}"
          description: "Device {{ $labels.device }} on {{ $labels.instance }} is reporting read errors"

  - name: service_alerts
    rules:
      - alert: DockerDaemonDown
        expr: up{job="docker"} == 0
        for: 3m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "Docker daemon unreachable on {{ $labels.instance }}"
          description: "Docker metrics endpoint on {{ $labels.instance }} has been down for 3 minutes"

  - name: prometheus_alerts
    rules:
      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "Prometheus target missing: {{ $labels.instance }}"
          description: "Scrape target {{ $labels.job }}/{{ $labels.instance }} has been down for 5 minutes"

      - alert: PrometheusStorageFull
        expr: (prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_head_chunks_storage_size_bytes) > 0.9
        for: 10m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Prometheus storage nearly full"
          description: "Prometheus TSDB is over 90% of its storage limit"
