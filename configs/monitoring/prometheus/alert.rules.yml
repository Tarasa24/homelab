groups:
  - name: node_alerts
    rules:
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
          alerttype: infrastructure
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been unreachable for more than 2 minutes"

      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 10m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "High memory on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      # /media and /immich are the USB-attached bulk-storage mounts (all of them
      # are the same physical disk, /dev/sdc1, surfaced into several LXCs), and
      # they are expected to run close to full - that is what cold storage is
      # for. They are excluded here so the warning does not repeat nightly for a
      # condition that is known and not actionable. They are deliberately NOT
      # excluded from DiskSpaceCritical below, so a disk that is genuinely about
      # to fill up and break Jellyfin/Immich writes is still reported once.
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint!~"/media|/immich|/mnt/USB.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint!~"/media|/immich|/mnt/USB.*"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Low disk space on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Only {{ $value | printf \"%.1f\" }}% free on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 5
        for: 5m
        labels:
          severity: critical
          alerttype: storage
        annotations:
          summary: "Critical disk space on {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "Only {{ $value | printf \"%.1f\" }}% free on {{ $labels.instance }}:{{ $labels.mountpoint }}"

      - alert: DiskReadingErrors
        expr: rate(node_disk_read_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          alerttype: storage
        annotations:
          summary: "Disk read errors on {{ $labels.instance }}"
          description: "Device {{ $labels.device }} on {{ $labels.instance }} is reporting read errors"

  - name: service_alerts
    rules:
      - alert: DockerDaemonDown
        expr: up{job="docker"} == 0
        for: 3m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "Docker daemon unreachable on {{ $labels.instance }}"
          description: "Docker metrics endpoint on {{ $labels.instance }} has been down for 3 minutes"

  - name: prometheus_alerts
    rules:
      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          alerttype: infrastructure
        annotations:
          summary: "Prometheus target missing: {{ $labels.instance }}"
          description: "Scrape target {{ $labels.job }}/{{ $labels.instance }} has been down for 5 minutes"

      # PrometheusStorageFull was removed deliberately. Its expression divided
      # prometheus_tsdb_storage_blocks_bytes by
      # prometheus_tsdb_head_chunks_storage_size_bytes, which is not a fill ratio
      # of anything - neither series relates to the configured retention limit -
      # so it fired on a healthy, nearly empty TSDB and cried wolf continuously.
      # Retention is already bounded by --storage.tsdb.retention.size=5GB, and
      # actual disk pressure is covered by DiskSpaceLow/DiskSpaceCritical on the
      # monitoring host. If a real TSDB-size alert is ever wanted, base it on
      # prometheus_tsdb_storage_blocks_bytes against that 5GB cap explicitly.

  - name: availability_alerts
    rules:
      # gatus_results_endpoint_success is a 1/0 gauge written on every probe, which
      # is the most direct "is it up right now" signal Gatus exposes.
      # Labels carried: name, group, host, path, key, type. `host` and `path` come
      # from the per-endpoint extra-labels in gatus/config.yaml; `host` is what the
      # alertmanager inhibit rules match on.
      #
      # NOTE: the Gatus docs describe metrics named gatus_check_result_total and
      # gatus_uptime. Those do NOT exist in the shipped binary - the real names were
      # confirmed against `ghcr.io/twin/gatus:stable` /metrics output. Re-verify
      # these names after any Gatus upgrade, because a renamed metric silently
      # disables this alert.
      - alert: ExternalServiceDown
        expr: gatus_results_endpoint_success == 0
        # 60s probe + 60s scrape + 2m hold => roughly 3-4 minutes to page.
        for: 2m
        labels:
          severity: critical
          alerttype: service
        annotations:
          summary: "{{ $labels.name }} ({{ $labels.group }}) is down"
          description: "Gatus probe for {{ $labels.name }} in group {{ $labels.group }} has been failing for more than 2 minutes on {{ $labels.host }} via the {{ $labels.path }} path"

      # Only emitted for TLS endpoints. All public vhosts share one wildcard cert,
      # so this will fire once per public endpoint - grouped by alertname in
      # alertmanager, so it still arrives as a single notification.
      - alert: TLSCertificateExpiringSoon
        expr: gatus_results_certificate_expiration_seconds > 0 and gatus_results_certificate_expiration_seconds < 604800
        for: 1h
        labels:
          severity: warning
          alerttype: service
        annotations:
          summary: "TLS certificate for {{ $labels.name }} expires in under 7 days"
          description: "The certificate served for {{ $labels.name }} ({{ $labels.group }}) expires in {{ $value | humanizeDuration }}; check that certbot renewal on the DMZ router is working"

      - alert: GatusDown
        expr: up{job="gatus"} == 0
        for: 3m
        labels:
          severity: critical
          alerttype: infrastructure
          # Set here rather than on the scrape target: a "host" label on the
          # gatus job would collide with the per-endpoint host from Gatus
          # extra-labels and Prometheus would rename the latter to exported_host,
          # breaking the alertmanager inhibit rules keyed on host.
          host: monitoring
        annotations:
          summary: "Gatus is down"
          description: "Prometheus has been unable to scrape Gatus for more than 3 minutes; service availability probing is blind"

  - name: container_alerts
    rules:
      - alert: CAdvisorDown
        expr: up{job="cadvisor"} == 0
        for: 3m
        labels:
          severity: critical
          alerttype: infrastructure
        annotations:
          summary: "cAdvisor unreachable on {{ $labels.instance }}"
          description: "cAdvisor metrics endpoint on {{ $labels.instance }} has been down for 3 minutes; container-level alerting is blind while this is firing"

      - alert: ContainerDown
        expr: absent_over_time(container_last_seen{name="ntfy"}[10m])
        for: 5m
        labels:
          severity: critical
          alerttype: service
          host: dmz-docker-host
          container: ntfy
        annotations:
          summary: "Container ntfy has disappeared"
          description: "cAdvisor has not seen container ntfy on dmz-docker-host for 10 minutes"

