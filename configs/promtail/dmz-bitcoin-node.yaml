server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  # VLAN 50, consistent with the other DMZ hosts. This container has a mon NIC
  # at 10.0.50.103, so it reaches Loki over the out-of-band monitoring segment
  # rather than through the DMZ router.
  - url: http://10.0.50.4:3100/loki/api/v1/push

scrape_configs:
  # bitcoind and electrs run as systemd units and log to the journal, so this is
  # where the "why" lives when SystemdUnitDown fires for either of them.
  - job_name: journal
    journal:
      max_age: 12h
      path: /var/log/journal
      labels:
        instance: dmz-bitcoin-node
        stream: stdout
    relabel_configs:
      # Per-session systemd scopes (session-1234.scope) and per-user manager
      # units are created fresh for every login, so keeping them would grow the
      # number of Loki streams without bound - the classic cardinality trap.
      - source_labels: ['__journal__systemd_unit']
        regex: '(session-\d+\.scope|user@\d+\.service|user-runtime-dir@\d+\.service)'
        action: drop
      # Default first, then override when the entry actually has a unit. Kernel
      # and early-boot messages carry no unit at all; without the default they
      # would produce a bare "<instance>/" job label.
      - target_label: 'service_name'
        replacement: 'kernel'
      - target_label: 'container_name'
        replacement: 'kernel'
      - source_labels: ['__journal__systemd_unit']
        regex: '(.+)'
        target_label: 'service_name'
        replacement: '$1'
      - source_labels: ['__journal__systemd_unit']
        regex: '(.+)'
        target_label: 'container_name'
        replacement: '$1'
      - source_labels: ['instance', 'service_name']
        separator: '/'
        target_label: 'job'
