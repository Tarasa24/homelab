server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  # The LAN address, not the VLAN 50 one: the PVE host owns vmbr0 and has no
  # interface on the monitoring VLAN, so 10.0.1.4 is the definitively routable
  # path from here (it is inside the host's own 10.0.0.0/22).
  - url: http://10.0.1.4:3100/loki/api/v1/push

scrape_configs:
  # systemd-journald is the only log source on a Proxmox host worth having:
  # kernel messages, LXC/VM start and stop, storage and ZFS errors, and the
  # pve* daemons all land there. There are no plain log files to tail.
  - job_name: journal
    journal:
      max_age: 12h
      path: /var/log/journal
      labels:
        instance: pve
        stream: stdout
    relabel_configs:
      # Per-session systemd scopes (session-1234.scope) and per-user manager
      # units are created fresh for every login, so keeping them would grow the
      # number of Loki streams without bound - the classic cardinality trap.
      - source_labels: ['__journal__systemd_unit']
        regex: '(session-\d+\.scope|user@\d+\.service|user-runtime-dir@\d+\.service)'
        action: drop
      # Default first, then override when the entry actually has a unit. Kernel
      # and early-boot messages carry no unit at all; without the default they
      # would produce a bare "<instance>/" job label.
      - target_label: 'service_name'
        replacement: 'kernel'
      - target_label: 'container_name'
        replacement: 'kernel'
      - source_labels: ['__journal__systemd_unit']
        regex: '(.+)'
        target_label: 'service_name'
        replacement: '$1'
      - source_labels: ['__journal__systemd_unit']
        regex: '(.+)'
        target_label: 'container_name'
        replacement: '$1'
      - source_labels: ['instance', 'service_name']
        separator: '/'
        target_label: 'job'
