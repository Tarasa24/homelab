server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.0.50.4:3100/loki/api/v1/push

scrape_configs:
  - job_name: technitium
    static_configs:
      - targets:
          - localhost
        labels:
          job: dns/technitium-dns
          service_name: technitium-dns
          instance: dns
          stream: stdout
          __path__: /opt/technitium-dns/config/logs/*.log

  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: dns/syslog
          service_name: syslog
          instance: dns
          stream: stdout
          __path__: /var/log/messages
