server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.0.50.4:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx_access
    static_configs:
      - targets:
          - localhost
        labels:
          job: dmz-router/nginx
          service_name: nginx
          container_name: nginx
          instance: dmz-router
          stream: stdout
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            status: status
            request_method: request_method
            request_uri: request_uri
            remote_addr: remote_addr
            server_name: server_name
            request_time: request_time
            upstream_response_time: upstream_response_time
      - labels:
          status:
          request_method:
          server_name:

  - job_name: nginx_error
    static_configs:
      - targets:
          - localhost
        labels:
          job: dmz-router/nginx
          service_name: nginx
          container_name: nginx
          instance: dmz-router
          stream: stderr
          __path__: /var/log/nginx/error.log

  - job_name: nginx_stream
    static_configs:
      - targets:
          - localhost
        labels:
          job: dmz-router/nginx
          service_name: nginx
          container_name: nginx
          instance: dmz-router
          stream: stdout
          __path__: /var/log/nginx/stream.log

  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: dmz-router/syslog
          service_name: syslog
          container_name: syslog
          instance: dmz-router
          stream: stdout
          __path__: /var/log/messages
