---
###############################################################
#                   Authelia configuration                    #
###############################################################

server:
  address: "tcp://:9091"
  endpoints:
    authz:
      auth-request:
        implementation: "AuthRequest"
        authn_strategies:
          - name: "CookieSession"
          - name: "HeaderAuthorization"
log:
  level: "debug"

totp:
  issuer: "homelab.tarasa24.dev"

# identity_validation:
#   reset_password:
#     jwt_secret: 'a_very_important_secret'

authentication_backend:
  file:
    path: "/secrets/users_database.yml"

access_control:
  default_policy: "deny"
  rules:
    - domain: "cal.homelab.tarasa24.dev"
      policy: "one_factor"
      subject:
        - ["group:radicale-users"]

session:
  cookies:
    - domain: "homelab.tarasa24.dev"
      authelia_url: "https://auth.homelab.tarasa24.dev"
      # Landing page when logging in at the portal with no rd= parameter.
      # Previously www.homelab.tarasa24.dev, which has no vhost. Revisit when a
      # real dashboard exists.
      default_redirection_url: "https://status.homelab.tarasa24.dev"

regulation:
  max_retries: 3
  find_time: "2 minutes"
  ban_time: "5 minutes"

storage:
  # encryption_key: 'you_must_generate_a_random_string_of_more_than_twenty_chars_and_configure_this'
  local:
    path: "/config/db.sqlite3"

notifier:
  filesystem:
    filename: "/config/notification.txt"

identity_providers:
  oidc:
    # hmac_secret:
    jwks:
      - key: |
          {{ secret "/secrets/private.pem" | mindent 10 "|" | msquote }}

    ## The other portions of the mandatory OpenID Connect 1.0 configuration go here.
    ## See: https://www.authelia.com/c/oidc
    clients:
      - client_id: "jellyfin"
        client_name: "Jellyfin"
        client_secret: "$$pbkdf2-sha512$$310000$$HT4XYxFi0TCQXKZXpsO.Wg$$GwT9khsBbLynH80KK9niS1NRO8kol9aId/q1vrksXeX4f7esYzk6f5tmPCDY2bFjeWu9eLWlwkfJsPT1Piy5OA"
        public: false
        authorization_policy: "one_factor"
        require_pkce: true
        pkce_challenge_method: "S256"
        redirect_uris:
          - "https://jellyfin.homelab.tarasa24.dev/sso/OID/redirect/Authelia"
        scopes:
          - "openid"
          - "profile"
          - "groups"
        userinfo_signed_response_alg: "none"
        token_endpoint_auth_method: "client_secret_post"
      - client_id: "immich"
        client_name: "Immich"
        client_secret: "$$pbkdf2-sha512$$310000$$gdeg58hplH4CYWDtpg8z3A$$jviQMBc2GuzKQ9ophWQqxvNTa6aAvWdz6EiIVKgYvkD.TbbfLK4FLk989c1VgznxZnm0dP9w6ZDeztbk5qOM5A"
        public: false
        authorization_policy: "one_factor"
        redirect_uris:
          - "app.immich:///oauth-callback"
          - "https://immich.homelab.tarasa24.dev/auth/login"
          - "https://immich.homelab.tarasa24.dev/user-settings"
        scopes:
          - "openid"
          - "profile"
          - "email"
        userinfo_signed_response_alg: "none"
      - client_id: "homeassistant"
        client_name: "Home Assistant"
        client_secret: "$$pbkdf2-sha512$$310000$$8DbtIz6xP9WeyhGImghRNw$$0U.xwtTBwMd/kjSjZWKCyjVchdrvYpmDXm5H/db49yHompyEWF2X7Ze1sroBMtz4lMdYHfT5S0se.hOfBTED7g"
        public: false
        require_pkce: true
        pkce_challenge_method: "S256"
        authorization_policy: "one_factor"
        redirect_uris:
          - "https://homeassistant.lan.tarasa24.dev/auth/oidc/callback"
        scopes:
          - "openid"
          - "profile"
          - "groups"
        id_token_signed_response_alg: "RS256"
        token_endpoint_auth_method: "client_secret_post"