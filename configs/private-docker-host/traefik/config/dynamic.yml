tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/letsencrypt/live/*.lan.tarasa24.dev/fullchain.pem
        keyFile: /etc/letsencrypt/live/*.lan.tarasa24.dev/privkey.pem

http:
  middlewares:
    hsts:
      headers:
        sslRedirect: true
        stsPreload: true
        stsSeconds: 31536000
        customRequestHeaders:
          Strict-Transport-Security: max-age=31536000
        customResponseHeaders:
          Strict-Transport-Security: max-age=31536000
  routers:
    prowlarr:
      rule: Host(`prowlarr.lan.tarasa24.dev`)
      entrypoints:
        - https
      tls: true
      service: prowlarr
      middlewares:
        - hsts
    sonarr:
      rule: Host(`sonarr.lan.tarasa24.dev`)
      entrypoints:
        - https
      tls: true
      service: sonarr
      middlewares:
        - hsts
    radarr:
      rule: Host(`radarr.lan.tarasa24.dev`)
      entrypoints:
        - https
      tls: true
      service: radarr
      middlewares:
        - hsts
    bazarr:
      rule: Host(`bazarr.lan.tarasa24.dev`)
      entrypoints:
        - https
      tls: true
      service: bazarr
      middlewares:
        - hsts
    qbittorrent:
      rule: Host(`qbittorrent.lan.tarasa24.dev`)
      entrypoints:
        - https
      tls: true
      service: qbittorrent
      middlewares:
        - hsts
    homeassistant:
      rule: Host(`homeassistant.lan.tarasa24.dev`)
      entrypoints:
        - https
      tls: true
      service: homeassistant
      middlewares:
        - hsts
    # UniFi OS Server is a separate VM now, so file provider not docker provider.
    unifi:
      rule: Host(`unifi.lan.tarasa24.dev`)
      entrypoints:
        - https
      tls: true
      service: unifi
      middlewares:
        - hsts
  services:
    prowlarr:
      loadBalancer:
        servers:
          - url: http://10.0.30.23:9696
    sonarr:
      loadBalancer:
        servers:
          - url: http://10.0.30.23:8989
    radarr:
      loadBalancer:
        servers:
          - url: http://10.0.30.23:7878
    bazarr:
      loadBalancer:
        servers:
          - url: http://10.0.30.23:6767
    qbittorrent:
      loadBalancer:
        servers:
          - url: http://10.0.30.23:8080
    homeassistant:
      loadBalancer:
        servers:
          - url: http://10.0.30.15:8123
    unifi:
      loadBalancer:
        servers:
          # :11443, not the old controller's :8443 -- UniFi OS Server maps 11443:443.
          - url: https://10.0.30.16:11443
        serversTransport: unifi-insecure
  serversTransports:
    # Unifi serves a self-signed cert on :11443.
    unifi-insecure:
      insecureSkipVerify: true
