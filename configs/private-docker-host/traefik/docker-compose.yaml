services:
  traefik:
    image: "traefik:v3.1.4"
    container_name: "traefik"
    command:
      # Traefik logged nothing after startup, so promtail had no stream to ship
      # and there was no request-level visibility for anything behind it.
      # Access log goes to stdout by default, which is where promtail's docker
      # service discovery reads. JSON matches the nginx access log format on the
      # DMZ router, so both are queryable the same way in Loki.
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.https.address=:443"
      - "--serverstransport.insecureSkipVerify=true"
    ports:
      - "10.0.1.20:80:80"
      - "10.0.1.20:443:443"
      - "10.0.1.20:8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/etc/letsencrypt/live/*.lan.tarasa24.dev/fullchain.pem:/certs/fullchain.pem:ro"
      - "/etc/letsencrypt/live/*.lan.tarasa24.dev/privkey.pem:/certs/privkey.pem:ro"
      - "./traefik/config/dynamic.yml:/etc/traefik/dynamic.yml:ro"
    restart: unless-stopped
