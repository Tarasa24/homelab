services:
  radicale:
    image: 11notes/radicale:3.1.9
    container_name: radicale
    ports:
      - "10.0.40.22:5232:5232"
    volumes:
      - radicale_data:/radicale/var
      - ./radicale/config:/radicale/etc
    restart: unless-stopped

volumes:
  radicale_data:
    external: true
    name: root_radicale_data
