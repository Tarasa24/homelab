services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage_public
    restart: unless-stopped
    ports:
      - "10.0.40.25:3000:3000"
    volumes:
      - ./homepage/config:/app/config
      # No docker.sock mount here on purpose: this container is reachable from
      # the internet (via dmz-proxy). Granting it Docker API access would turn
      # a Homepage compromise into a host takeover. Service list below is
      # static YAML instead of label auto-discovery.
    environment:
      # IP:port is needed too - Gatus probes this container directly by IP,
      # bypassing nginx, and Homepage 403s any Host header not on this list.
      HOMEPAGE_ALLOWED_HOSTS: "dash.homelab.tarasa24.dev,10.0.40.25:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
