services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.3
    container_name: jellyfin
    hostname: jellyfin
    user: 1000:1000
    ports:
      - 10.0.40.21:8096:8096
      - 10.0.40.21:8920:8920
    volumes:
      - jelllyfin_config:/config
      - /cache:/cache
      - type: bind
        source: /media
        target: /media
    restart: 'unless-stopped'
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.homelab.tarasa24.dev
    extra_hosts:
      # avoids hairpin NAT: DMZ can't loop back through the UXG to its own
      # public IP, which broke SSO-Auth's server-side calls to Authelia
      - "auth.homelab.tarasa24.dev:10.0.40.10"

volumes:
  jelllyfin_config:
    external: true
    name: root_jellyfin_config