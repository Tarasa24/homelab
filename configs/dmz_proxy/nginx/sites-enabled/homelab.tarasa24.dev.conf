# Bare apex domain. Landing point for anyone who types the domain without a
# subdomain - redirects straight to the public dashboard. Needs its own cert
# (see certificates list in dmz-proxy-init.yml): the *.homelab.tarasa24.dev
# wildcard does not cover the naked apex.
server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         homelab.tarasa24.dev;

    ssl_certificate     /etc/letsencrypt/live/homelab.tarasa24.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homelab.tarasa24.dev/privkey.pem;

    access_log          /var/log/nginx/access.log json_analytics buffer=512k flush=1m;
    error_log           /var/log/nginx/error.log warn;

    location / {
        return 301 https://dash.homelab.tarasa24.dev$request_uri;
    }
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name homelab.tarasa24.dev;
    return      301 https://dash.homelab.tarasa24.dev$request_uri;
}
