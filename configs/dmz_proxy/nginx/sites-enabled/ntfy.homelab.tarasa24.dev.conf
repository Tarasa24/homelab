server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         ntfy.homelab.tarasa24.dev;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/*.homelab.tarasa24.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/*.homelab.tarasa24.dev/privkey.pem;

    # logging
    access_log          /var/log/nginx/access.log json_analytics buffer=512k flush=1m;
    error_log           /var/log/nginx/error.log warn;

    location / {
        proxy_pass            http://10.0.40.24:8080;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;

        # WebSocket and SSE support (required for ntfy push)
        proxy_http_version    1.1;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection "upgrade";

        # Disable buffering for SSE streams
        proxy_buffering       off;
        proxy_read_timeout    3600s;
    }

    # additional config
    include nginxconfig.io/general.conf;
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name ntfy.homelab.tarasa24.dev;
    return      301 https://ntfy.homelab.tarasa24.dev$request_uri;
}
