server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         dash.homelab.tarasa24.dev;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/*.homelab.tarasa24.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/*.homelab.tarasa24.dev/privkey.pem;

    # security
    include             nginxconfig.io/security.conf;

    # logging
    access_log          /var/log/nginx/access.log json_analytics buffer=512k flush=1m;
    error_log           /var/log/nginx/error.log warn;

    # reverse proxy
    location / {
        proxy_pass            http://10.0.40.25:3000/;
        include               nginxconfig.io/proxy.conf;
        # Portal-redirection variant, not the "-basic" one cal.homelab uses -
        # this is a browser dashboard, not a Basic-auth API client. See
        # authelia-authrequest.conf for why.
        include               authelia/authelia-authrequest.conf;
    }

    # auth
    include             authelia/authelia-location.conf;

    # additional config
    include nginxconfig.io/general.conf;
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name dash.homelab.tarasa24.dev;
    return      301 https://dash.homelab.tarasa24.dev$request_uri;
}
