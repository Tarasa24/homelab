## Send a subrequest to Authelia to verify if the user is authenticated and has permission to access the resource.
auth_request /internal/authelia/authz;

## Save the upstream response headers from Authelia to variables.
auth_request_set $user $upstream_http_remote_user;
auth_request_set $groups $upstream_http_remote_groups;
auth_request_set $name $upstream_http_remote_name;
auth_request_set $email $upstream_http_remote_email;

## Inject the response headers from the variables into the request made to the backend.
proxy_set_header Remote-User $user;
proxy_set_header Remote-Groups $groups;
proxy_set_header Remote-Name $name;
proxy_set_header Remote-Email $email;

## Modern Method: redirect to the Authelia portal instead of returning a bare
## 401 (which authrequest-basic does on purpose, for HTTP Basic clients like
## CalDAV - browsers turn that into the native basic-auth prompt, not what we
## want here). $redirection_url comes from the Location header Authelia's
## AuthRequest response sets, built from session.cookies[].authelia_url in
## configuration.yml, with rd= pointing back to this URL after login.
auth_request_set $redirection_url $upstream_http_location;
error_page 401 =302 $redirection_url;
