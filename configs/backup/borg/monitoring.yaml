source_directories:
  - /var/lib/docker/volumes/root_grafana-data/_data
  - /var/lib/docker/volumes/root_gatus-data/_data

repositories:
  - path: ssh://backup@10.0.1.3/backup/repos/monitoring

compression: zlib,6
ssh_command: ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no
unknown_unencrypted_repo_access_is_ok: true

keep_daily: 7
keep_weekly: 4
keep_monthly: 6
keep_yearly: 2
archive_name_format: "{hostname}-{now}"
match_archives: "{hostname}-*"

checks:
  - name: repository
  - name: archives
check_last: 3

before_backup:
  - cd /root && docker compose stop grafana
  - cd /root && docker compose stop gatus
after_backup:
  - cd /root && docker compose start grafana
  - cd /root && docker compose start gatus
on_error:
  - cd /root && docker compose start grafana
  - cd /root && docker compose start gatus
