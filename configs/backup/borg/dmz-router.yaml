source_directories:
  - /etc/letsencrypt

repositories:
  - path: ssh://backup@10.0.1.3/backup/repos/dmz-router

compression: zlib,6
ssh_command: ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no
unknown_unencrypted_repo_access_is_ok: true

keep_daily: 7
keep_weekly: 4
keep_monthly: 6
keep_yearly: 2
archive_name_format: "{hostname}-{now}"
match_archives: "{hostname}-*"

checks:
  - name: repository
  - name: archives
check_last: 3
